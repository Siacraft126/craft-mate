    // Funkcija skaitļu pārvēršanai vārdos (Latviešu valodā)
    function skaitsVardiem(amount) {
      const eiro = Math.floor(amount);
      const centi = Math.round((amount - eiro) * 100);
      
      const vieni = ['', 'viens', 'divi', 'trīs', 'četri', 'pieci', 'seši', 'septiņi', 'astoņi', 'deviņi'];
      const padmiti = ['desmit', 'vienpadsmit', 'divpadsmit', 'trīspadsmit', 'četrpadsmit', 'piecpadsmit', 'sešpadsmit', 'septiņpadsmit', 'astoņpadsmit', 'deviņpadsmit'];
      const desmiti = ['', 'desmit', 'divdesmit', 'trīsdesmit', 'četrdesmit', 'piecdesmit', 'sešdesmit', 'septiņdesmit', 'astoņdesmit', 'deviņdesmit'];
      const simti = ['', 'simts', 'divi simti', 'trīs simti', 'četri simti', 'pieci simti', 'seši simti', 'septiņi simti', 'astoņi simti', 'deviņi simti'];

      if (eiro === 0) return `nulle eiro un ${centi < 10 ? '0' + centi : centi} centi`;

      function convertGroup(n) {
        let res = '';
        let s = Math.floor(n / 100);
        let d = Math.floor((n % 100) / 10);
        let v = n % 10;

        if (s > 0) res += simti[s] + ' ';
        if (d === 1) {
          res += padmiti[v] + ' ';
        } else {
          if (d > 0) res += desmiti[d] + ' ';
          if (v > 0) res += vieni[v] + ' ';
        }
        return res.trim();
      }

      let result = '';
      let tukstosi = Math.floor(eiro / 1000);
      let atlikums = eiro % 1000;

      if (tukstosi > 0) {
        result += convertGroup(tukstosi) + (tukstosi === 1 ? ' tūkstotis ' : ' tūkstoši ');
      }
      if (atlikums > 0 || result === '') {
        result += convertGroup(atlikums);
      }

      result = result.trim();
      result = result.charAt(0).toUpperCase() + result.slice(1);
      
      const centiStr = centi < 10 ? '0' + centi : centi;
      return `${result} eiro un ${centiStr} centi`;
    }

      const [trash, setTrash] = useState([]);
      const [newTask, setNewTask] = useState('');

      // Pievienot manuālu darbu
      const addCustomService = () => {
        if (!customName || !customPrice) return;
        const newId = 'c_' + Date.now();
        const priceNum = parseFloat(customPrice) || 0;
        const item = {
          id: newId,
          cat: 'Citi darbi',
          name: customName,
          price: priceNum,
          unit: customUnit
        };
        setCustomServices([...customServices, item]);
        setSelectedServices([...selectedServices, { id: newId, qty: parseFloat(customQty) || 1 }]);
        setCustomName('');
        setCustomPrice('');
      };

      const toggleService = (id) => {
        if (selectedServices.some(s => s.id === id)) {
          setSelectedServices(selectedServices.filter(s => s.id !== id));
        } else {
          setSelectedServices([...selectedServices, { id, qty: 10 }]);
        }
      };

      const removeSelectedService = (id) => {
        setSelectedServices(selectedServices.filter(s => s.id !== id));
      };

      const updateQty = (id, val) => {
        const num = Number(val) || 0;
        setSelectedServices(selectedServices.map(s => s.id === id ? { ...s, qty: num } : s));
      };

      const updatePrice = (id, val) => {
        const num = parseFloat(val);
        setEditedPrices({
          ...editedPrices,
          [id]: isNaN(num) ? '' : num
        });
      };

      const addClient = () => {
        if (!newClient.name) return;
        const c = { ...newClient, id: Date.now() };
        setClients([...clients, c]);
        setSelectedClient(c);
        setNewClient({ name: '', regNr: '', address: '', banka: '', konts: '' });
      };

      const deleteClient = (id) => {
        const updated = clients.filter(c => c.id !== id);
        setClients(updated);
        if (selectedClient && selectedClient.id === id && updated.length > 0) {
          setSelectedClient(updated[0]);
        }
      };

      const addColorEntry = () => {
        if (!newColorEntry.room || !newColorEntry.ralCode) return;
        const entry = {
          id: Date.now(),
          clientId: Number(newColorEntry.clientId) || (clients[0] ? clients[0].id : 1),
          room: newColorEntry.room,
          manufacturer: newColorEntry.manufacturer,
          colorName: newColorEntry.colorName,
          ralCode: newColorEntry.ralCode
        };
        setClientColors([...clientColors, entry]);
        setNewColorEntry({ clientId: clients[0] ? clients[0].id : '', room: '', manufacturer: '', colorName: '', ralCode: '' });
      };

      const deleteColorEntry = (id) => {
        setClientColors(clientColors.filter(c => c.id !== id));
      };

      const deleteTask = (id) => {
        const taskToDelete = tasks.find(t => t.id === id);
        if (taskToDelete) {
          setTrash([...trash, taskToDelete]);
          setTasks(tasks.filter(t => t.id !== id));
        }
      };

      const restoreTask = (id) => {
        const taskToRestore = trash.find(t => t.id === id);
        if (taskToRestore) {
          setTasks([...tasks, taskToRestore]);
          setTrash(trash.filter(t => t.id !== id));
        }
      };

      const emptyTrash = () => {
        setTrash([]);
      };

      const categories = [
        'Visas', 
        'Demontāža', 
        'Sienas', 
        'Mūrēšana', 
        'Griesti', 
        'Grīda', 
        'Flīzēšana', 
        'Elektroinstalācija', 
        'Santehnika', 
        'Logi un Durvis', 
        'Sadzīves tehnika', 
        'Mēbeles', 
        'Pamati', 
        'Terases & Guļbūves', 
        'Jumts', 
        'Fasāde', 
        'Labiekārtošana', 
        'Žogs', 
        'Komunikācijas', 
        'Citi darbi'
      ];

      const getCategoryIcon = (cat) => {
        switch(cat) {
          case 'Demontāža': return '🔨';
          case 'Sienas': return '🧱';
          case 'Mūrēšana': return '🏗️';
          case 'Griesti': return '🏠';
          case 'Grīda': return '🪵';
          case 'Flīzēšana': return '🔳';
          case 'Elektroinstalācija': return '⚡';
          case 'Santehnika': return '🚰';
          case 'Logi un Durvis': return '🚪';
          case 'Sadzīves tehnika': return '🔌';
          case 'Mēbeles': return '🛋️';
          case 'Pamati': return '📐';
          case 'Terases & Guļbūves': return '🏡';
          case 'Jumts': return '⛺';
          case 'Fasāde': return '🏛️';
          case 'Labiekārtošana': return '🌱';
          case 'Žogs': return '🚧';
          case 'Komunikācijas': return '🌐';
          case 'Citi darbi': return '🛠️';
          default: return '🔍';
        }
      };

      const allServices = [...MASTER_SERVICES, ...customServices];

      const filteredServices = allServices.filter(srv => {
        const matchesCat = activeCategory === 'Visas' || srv.cat === activeCategory;
        const matchesSearch = srv.name.toLowerCase().includes(searchTerm.toLowerCase());
        return matchesCat && matchesSearch;
      });

      let subtotal = 0;
      const itemsCalculated = selectedServices.map(sel => {
        const srv = allServices.find(m => m.id === sel.id);
        if (!srv) return null;
        
        let price = editedPrices[sel.id] !== undefined && editedPrices[sel.id] !== '' 
          ? editedPrices[sel.id] 
          : srv.price;

        if (srv.unit === 'm²' && sel.qty < 30 && sel.qty > 0 && editedPrices[sel.id] === undefined) {
          price = price * 1.275;
        }

        const total = price * sel.qty;
        subtotal += total;
        return { ...srv, qty: sel.qty, finalPrice: price, total };
      }).filter(Boolean);

      let taxAmount = 0;
      if (taxMode === 'pvn') taxAmount = subtotal * 0.21;
      else if (taxMode === 'mun') taxAmount = subtotal * 0.25;

      const grandTotal = Math.round((subtotal + taxAmount) * 100) / 100;

      // WhatsApp / E-pasta teksta sagatavošana tāmmei
      const sendEstimateViaWhatsApp = () => {
        let text = `Labdien! Aprēķinātā darbu tāme no ${vendor.vards} (${selectedClient.name}):\n\n`;
        itemsCalculated.forEach((it, idx) => {
          text += `${idx + 1}. ${it.name} - ${it.qty} ${it.unit} × ${it.finalPrice.toFixed(2)} € = ${it.total.toFixed(2)} €\n`;
        });
        if (taxMode !== 'bez') {
          text += `\nStarpsumma: ${subtotal.toFixed(2)} €`;
          text += `\nNodoklis (${taxMode.toUpperCase()}): ${taxAmount.toFixed(2)} €`;
        }
        text += `\n\nKOPĀ APMAKSAI: ${grandTotal.toFixed(2)} €`;
        
        const encoded = encodeURIComponent(text);
        window.open(`https://api.whatsapp.com/send?text=${encoded}`, '_blank');
      };

      const sendEstimateViaEmail = () => {
        let subject = encodeURIComponent(`Būvniecības darbu tāme - ${vendor.vards}`);
        let body = `Labdien!\n\nSūtu būvniecības un remontdarbu tāmi:\n\n`;
        itemsCalculated.forEach((it, idx) => {
          body += `${idx + 1}. ${it.name} - ${it.qty} ${it.unit} × ${it.finalPrice.toFixed(2)} € = ${it.total.toFixed(2)} €\n`;
        });
        if (taxMode !== 'bez') {
          body += `\nStarpsumma: ${subtotal.toFixed(2)} €`;
          body += `\nNodoklis (${taxMode.toUpperCase()}): ${taxAmount.toFixed(2)} €`;
        }
        body += `\n\nKOPĀ APMAKSAI: ${grandTotal.toFixed(2)} EUR\n\nAr cieņu,\n${vendor.vards}`;
        
        window.location.href = `mailto:?subject=${subject}&body=${encodeURIComponent(body)}`;
      };

      return (
        <div class="max-w-2xl mx-auto bg-slate-900/95 text-slate-100 min-h-screen pb-20 border-x border-blue-500/30 shadow-2xl">
          {/* Header */}
          <header class="p-4 bg-slate-950 border-b border-blue-500/40 relative overflow-hidden">
            <div class="flex justify-between items-center relative z-10">
              <div>
                <h1 class="text-xl font-black text-amber-500 tracking-wider">AS CRAFT <span class="text-blue-400 font-light">| Engineering</span></h1>
                <p class="text-xs text-slate-400">Izpildītājs: <span class="text-slate-200 font-bold">{vendor.vards}</span></p>
              </div>

              {/* NODOKĻU IZVĒLE */}
              <div class="flex items-center gap-1 bg-slate-900 p-1 rounded-lg border border-slate-700 text-xs">
                <button onClick={() => setTaxMode('pvn')} class={`px-2 py-1 rounded ${taxMode === 'pvn' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400'}`}>PVN 21%</button>
                <button onClick={() => setTaxMode('mun')} class={`px-2 py-1 rounded ${taxMode === 'mun' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400'}`}>MUN 25%</button>
                <button onClick={() => setTaxMode('bez')} class={`px-2 py-1 rounded ${taxMode === 'bez' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400'}`}>Bez PVN</button>
              </div>
            </div>

            {/* NAVIGĀCIJA */}
            <nav class="grid grid-cols-5 gap-1 mt-4 pt-3 border-t border-slate-800 text-center text-xs font-semibold">
              <button onClick={() => setActiveTab('tames')} class={`p-2 rounded ${activeTab === 'tames' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}`}>📋 Tāme</button>
              <button onClick={() => setActiveTab('rekini')} class={`p-2 rounded ${activeTab === 'rekini' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}`}>📑 Rēķini</button>
              <button onClick={() => setActiveTab('klienti')} class={`p-2 rounded ${activeTab === 'klienti' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}`}>👥 Klienti</button>
              <button onClick={() => setActiveTab('krasas')} class={`p-2 rounded ${activeTab === 'krasas' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}`}>🎨 Krāsas & Toti</button>
              <button onClick={() => setActiveTab('uzdevumi')} class={`p-2 rounded ${activeTab === 'uzdevumi' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}`}>✅ Uzdevumi</button>
            </nav>
          </header>

          <main class="p-4 space-y-6">
            {/* TĀME */}
            {activeTab === 'tames' && (
              <div class="space-y-4">
                <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700 space-y-3">
                  <input type="text" placeholder="🔍 Meklēt darbu pozīciju..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-slate-200 outline-none focus:border-blue-500" />
                  
                  {/* KATEGORIJU SLIDERIS */}
                  <div class="flex gap-1 overflow-x-auto pb-1 text-xs no-scrollbar">
                    {categories.map(cat => (
                      <button key={cat} onClick={() => setActiveCategory(cat)} class={`px-3 py-1.5 rounded-lg whitespace-nowrap font-medium transition-all ${activeCategory === cat ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-900 text-slate-400 hover:text-slate-200'}`}>
                        {getCategoryIcon(cat)} {cat}
                      </button>
                    ))}
                  </div>
                </div>

                {/* SADAĻA: CITI DARBI (MANUĀLĀ PIEVIENOŠANA) */}
                <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700 space-y-2 text-xs">
                  <h3 class="font-bold text-amber-400 text-sm">🛠️ PIEVIENOT CITU DARBU (MANUĀLI)</h3>
                  <div class="grid grid-cols-2 gap-2">
                    <input type="text" placeholder="Darba nosaukums (piem. Būvgružu izvešana)" value={customName} onChange={e => setCustomName(e.target.value)} class="col-span-2 bg-slate-900 border border-slate-700 rounded p-2 text-white" />
                    <input type="number" placeholder="Cena (€)" value={customPrice} onChange={e => setCustomPrice(e.target.value)} class="bg-slate-900 border border-slate-700 rounded p-2 text-white" />
                    <div class="flex gap-1">
                      <select value={customUnit} onChange={e => setCustomUnit(e.target.value)} class="bg-slate-900 border border-slate-700 rounded p-2 text-white">
                        <option value="m²">m²</option>
                        <option value="t/m">t/m</option>
                        <option value="Stunda">Stunda</option>
                        <option value="m³">m³</option>
                        <option value="gab">gab</option>
                        <option value="kompl">kompl</option>
                        <option value="m">m</option>
                        <option value="t">t</option>
                      </select>
                      <input type="number" placeholder="Daudz." value={customQty} onChange={e => setCustomQty(e.target.value)} class="w-16 bg-slate-900 border border-slate-700 rounded p-2 text-white" />
                    </div>
                  </div>
                  <button onClick={addCustomService} class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold p-2 rounded mt-1">➕ Pievienot darbu tāmē</button>
                </div>

                {/* KATALOGS */}
                <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700 space-y-3">
                  <h3 class="text-amber-500 font-bold text-sm">🛠️ DARBU KATALOGS ({activeCategory})</h3>
                  <div class="max-h-72 overflow-y-auto space-y-2 pr-1">
                    {filteredServices.length === 0 ? (
                      <div class="text-xs text-slate-500 italic text-center py-4">Šajā kategorijā nekas netika atrasts</div>
                    ) : (
                      filteredServices.map(srv => {
                        const isSel = selectedServices.some(s => s.id === srv.id);
                        return (
                          <div key={srv.id} onClick={() => toggleService(srv.id)} class={`p-2.5 rounded-lg border text-sm flex items-center justify-between cursor-pointer transition-all ${isSel ? 'bg-amber-500/15 border-amber-500/60 text-amber-300' : 'bg-slate-900/80 border-slate-800 text-slate-300 hover:border-slate-700'}`}>
                            <div class="flex items-center gap-2">
                              <span>{isSel ? '✅' : '⬛'}</span>
                              <div>
                                <div class="font-medium">{srv.name}</div>
                                <div class="text-xs text-slate-400">[{srv.cat}] — {srv.price.toFixed(2)} € / {srv.unit}</div>
                              </div>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>

                {/* TĀMĒ IEKĻAUTIE DARBI */}
                <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700 space-y-3">
                  <h3 class="text-amber-500 font-bold text-sm">📋 TĀMĒ IEKĻAUTIE DARBI ({itemsCalculated.length})</h3>
                  {itemsCalculated.length === 0 ? (
                    <div class="text-xs text-slate-500 italic text-center py-2">Nav izvēlēts neviens darbs</div>
                  ) : (
                    itemsCalculated.map(item => (
                      <div key={item.id} class="bg-slate-900 p-3 rounded border border-slate-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 text-sm">
                        <div class="flex-1 pr-2">
                          <div class="font-medium text-slate-200">{item.name}</div>
                          <div class="text-xs text-slate-400">Mērvienība: {item.unit}</div>
                        </div>

                        <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                          <div class="flex flex-col text-right">
                            <span class="text-[10px] text-slate-400">Cena (€/{item.unit}):</span>
                            <input 
                              type="number" 
                              step="0.01" 
                              value={item.finalPrice} 
                              onChange={e => updatePrice(item.id, e.target.value)} 
                              class="w-20 bg-slate-800 border border-slate-700 rounded p-1 text-center font-bold text-slate-100 text-xs" 
                            />
                          </div>

                          <div class="flex flex-col text-right">
                            <span class="text-[10px] text-slate-400">Daudzums:</span>
                            <input 
                              type="number" 
                              value={item.qty} 
                              onChange={e => updateQty(item.id, e.target.value)} 
                              class="w-16 bg-slate-800 border border-slate-700 rounded p-1 text-center font-bold text-amber-400 text-xs" 
                            />
                          </div>

                          <div class="flex flex-col text-right min-w-[70px]">
                            <span class="text-[10px] text-slate-400">Kopā:</span>
                            <span class="font-mono text-amber-400 font-bold text-xs">{item.total.toFixed(2)} €</span>
                          </div>

                          <button 
                            onClick={() => removeSelectedService(item.id)} 
                            title="Dzēst pozīciju"
                            class="ml-1 bg-red-900/40 hover:bg-red-800 text-red-300 font-bold px-2 py-1.5 rounded border border-red-700/50 text-xs transition-colors"
                          >
                            ❌
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                <div class="bg-slate-950 p-4 rounded-xl border border-amber-500/40 text-right font-mono space-y-1">
                  <div class="text-xs text-slate-400">Starpsumma: {subtotal.toFixed(2)} €</div>
                  {taxMode !== 'bez' && <div class="text-xs text-amber-400">Nodoklis ({taxMode.toUpperCase()}): {taxAmount.toFixed(2)} €</div>}
                  <div class="text-lg font-bold text-amber-500">KOPĀ APMAKSAI: {grandTotal.toFixed(2)} €</div>
                </div>

                {/* TĀMES SAGLABĀŠANAS UN NOSŪTĪŠANAS POGAS */}
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 pt-2">
                  <button onClick={() => window.print()} class="bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-500/40 py-2.5 px-3 rounded-lg font-bold text-xs flex items-center justify-center gap-1.5 shadow">
                    🖨️ Saglabāt PDF / Drukāt
                  </button>
                  <button onClick={sendEstimateViaWhatsApp} class="bg-emerald-700 hover:bg-emerald-600 text-white py-2.5 px-3 rounded-lg font-bold text-xs flex items-center justify-center gap-1.5 shadow">
                    💬 Nosūtīt uz WhatsApp
                  </button>
                  <button onClick={sendEstimateViaEmail} class="bg-blue-700 hover:bg-blue-600 text-white py-2.5 px-3 rounded-lg font-bold text-xs flex items-center justify-center gap-1.5 shadow">
                    📧 Nosūtīt uz E-pastu
                  </button>
                </div>
              </div>
            )}

            {/* RĒĶINI */}
            {activeTab === 'rekini' && (
              <div class="space-y-4">
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3 text-xs">
                  <h3 class="font-bold text-amber-400 text-sm">📅 RĒĶINA DATI UN IESTATĪJUMI</h3>
                  <div class="grid grid-cols-3 gap-2">
                    <div>
                      <label class="block text-slate-400 mb-1">Rēķina Nr.:</label>
                      <input type="text" value={invoiceNr} onChange={e => setInvoiceNr(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-amber-400 font-bold" />
                    </div>
                    <div>
                      <label class="block text-slate-400 mb-1">Izrakstīšanas datums:</label>
                      <input type="date" value={invoiceDate} onChange={e => setInvoiceDate(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white" />
                    </div>
                    <div>
                      <label class="block text-slate-400 mb-1">Apmaksas termiņš:</label>
                      <input type="date" value={dueDate} onChange={e => setDueDate(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white" />
                    </div>
                  </div>

                  <div class="pt-2">
                    <label class="block text-amber-400 font-bold mb-1">✍️ BRĪVI AIZPILDĀMAIS DARBU APRAKSTS / PIEZĪMES RĒĶINĀ:</label>
                    <textarea rows="2" value={customInvoiceText} onChange={e => setCustomInvoiceText(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white" placeholder="Ierakstiet papildus informāciju vai darbu aprakstu..."></textarea>
                  </div>
                </div>

                {/* OFICIĀLAIS RĒĶINS */}
                <div class="bg-white text-slate-900 p-6 rounded-xl shadow-2xl space-y-4 font-serif text-sm">
                  <div class="text-center font-bold text-base">
                    Rēķins Nr.: {invoiceNr}
                    <div class="text-xs font-normal text-slate-600 mt-0.5">
                      Izrakstīšanas datums un laiks: {invoiceDate} {new Date().toLocaleTimeString('lv-LV', {hour: '2-digit', minute:'2-digit'})}
                    </div>
                  </div>

                  <div class="grid grid-cols-2 gap-4 text-xs pt-2">
                    <div>
                      <strong class="block border-b border-slate-300 pb-1 mb-1">Maksātājs:</strong>
                      <div>{selectedClient.name}</div>
                      <div>Adrese: {selectedClient.address}</div>
                      <div>Reģ./PK Nr. {selectedClient.regNr}</div>
                      <div>Banka: {selectedClient.banka}</div>
                      <div>Konta Nr. {selectedClient.konts}</div>
                    </div>
                    <div>
                      <strong class="block border-b border-slate-300 pb-1 mb-1">Izpildītājs / Saņēmējs:</strong>
                      <div>{vendor.vards}</div>
                      <div>Adrese: {vendor.adrese}</div>
                      <div>Nod.maks./PK Nr. {vendor.pknr}</div>
                      <div>Banka: {vendor.banka}</div>
                      <div>Konta Nr. {vendor.konts}</div>
                    </div>
                  </div>

                  <div class="text-xs p-2 bg-slate-100 rounded border border-slate-300 italic">
                    <strong>Pakalpojuma apraksts:</strong> {customInvoiceText}
                  </div>

                  <table class="w-full text-xs border-collapse border border-slate-400 mt-4">
                    <thead>
                      <tr class="bg-amber-300">
                        <th class="border border-slate-400 p-1 text-center">Nr.</th>
                        <th class="border border-slate-400 p-1 text-left">Nosaukums</th>
                        <th class="border border-slate-400 p-1 text-center">Mērv.</th>
                        <th class="border border-slate-400 p-1 text-center">Daudz.</th>
                        <th class="border border-slate-400 p-1 text-right">Cena EUR</th>
                        <th class="border border-slate-400 p-1 text-right">Summa EUR</th>
                      </tr>
                    </thead>
                    <tbody>
                      {itemsCalculated.map((it, idx) => (
                        <tr key={it.id}>
                          <td class="border border-slate-400 p-1 text-center">{idx + 1}.</td>
                          <td class="border border-slate-400 p-1">{it.name}</td>
                          <td class="border border-slate-400 p-1 text-center">{it.unit}</td>
                          <td class="border border-slate-400 p-1 text-center">{it.qty}</td>
                          <td class="border border-slate-400 p-1 text-right">{it.finalPrice.toFixed(2)}</td>
                          <td class="border border-slate-400 p-1 text-right">{it.total.toFixed(2)} EUR</td>
                        </tr>
                      ))}
                      <tr>
                        <td colSpan="5" class="border border-slate-400 p-1 text-right font-bold">Starpsumma:</td>
                        <td class="border border-slate-400 p-1 text-right font-bold">{subtotal.toFixed(2)} EUR</td>
                      </tr>
                      {taxMode !== 'bez' && (
                        <tr>
                          <td colSpan="5" class="border border-slate-400 p-1 text-right font-bold">Nodoklis ({taxMode.toUpperCase()}):</td>
                          <td class="border border-slate-400 p-1 text-right font-bold">{taxAmount.toFixed(2)} EUR</td>
                        </tr>
                      )}
                      <tr class="bg-slate-100">
                        <td colSpan="5" class="border border-slate-400 p-1 text-right font-bold">Kopā apmaksai:</td>
                        <td class="border border-slate-400 p-1 text-right font-bold">{grandTotal.toFixed(2)} EUR</td>
                      </tr>
                    </tbody>
                  </table>

                  <div class="text-xs font-bold pt-2 border-t border-slate-300 mt-3">
                    Summa vārdiem: <span class="italic font-normal">{skaitsVardiem(grandTotal)}</span>
                  </div>

                  <div class="text-xs font-bold">
                    Apmaksas termiņš: {dueDate}
                  </div>
                  <div class="text-xs italic text-center pt-4 text-slate-600">
                    Šis rēķins ir sagatavots elektroniski un derīgs bez paraksta
                  </div>

                  <button onClick={() => window.print()} class="w-full bg-slate-900 text-white py-2.5 rounded font-sans text-xs font-bold mt-4 shadow hover:bg-slate-800">🖨️ Drukāt / Saglabāt PDF Rēķinu</button>
                </div>
              </div>
            )}

            {/* KLIENTI */}
            {activeTab === 'klienti' && (
              <div class="space-y-4">
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3 text-xs">
                  <h3 class="text-amber-500 font-bold text-sm">➕ PIEVIENOT JAUNU KLIENTU</h3>
                  <input type="text" placeholder="Klienta nosaukums / Vārds" value={newClient.name} onChange={e => setNewClient({...newClient, name: e.target.value})} class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white" />
                  <input type="text" placeholder="Adrese" value={newClient.address} onChange={e => setNewClient({...newClient, address: e.target.value})} class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white" />
                  <div class="grid grid-cols-2 gap-2">
                    <input type="text" placeholder="Reģ. / PK Nr." value={newClient.regNr} onChange={e => setNewClient({...newClient, regNr: e.target.value})} class="bg-slate-900 border border-slate-700 rounded p-2 text-white" />
                    <input type="text" placeholder="Banka" value={newClient.banka} onChange={e => setNewClient({...newClient, banka: e.target.value})} class="bg-slate-900 border border-slate-700 rounded p-2 text-white" />
                  </div>
                  <input type="text" placeholder="Konta Nr. (IBAN)" value={newClient.konts} onChange={e => setNewClient({...newClient, konts: e.target.value})} class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white" />
                  <button onClick={addClient} class="w-full bg-amber-500 text-slate-950 font-bold py-2 rounded text-xs hover:bg-amber-400">Saglabāt klientu</button>
                </div>

                <div class="space-y-2">
                  <h3 class="text-amber-500 font-bold text-sm">👥 ESOŠO KLIENTU SARAKSTS</h3>
                  {clients.map(c => (
                    <div key={c.id} class={`p-3 rounded-lg border text-sm flex justify-between items-center ${selectedClient.id === c.id ? 'bg-amber-500/20 border-amber-500' : 'bg-slate-800 border-slate-700'}`}>
                      <div onClick={() => setSelectedClient(c)} class="cursor-pointer flex-1">
                        <div class="font-bold text-amber-300">{c.name}</div>
                        <div class="text-xs text-slate-400">{c.address} | Reģ.nr: {c.regNr}</div>
                      </div>
                      <button onClick={() => deleteClient(c.id)} class="bg-red-600 hover:bg-red-500 text-white font-bold text-xs px-2.5 py-1.5 rounded ml-2">🗑️ Dzēst</button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* KRĀSAS UN TOŅI */}
            {activeTab === 'krasas' && (
              <div class="space-y-4">
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3 text-xs">
                  <h3 class="text-amber-500 font-bold text-sm">🎨 PIEVIENOT KLIENTA KRĀSAS UN RAL KODU</h3>
                  
                  <div>
                    <label class="block text-slate-400 mb-1">Izvēlēties klientu:</label>
                    <select 
                      value={newColorEntry.clientId} 
                      onChange={e => setNewColorEntry({...newColorEntry, clientId: e.target.value})} 
                      class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white"
                    >
                      {clients.map(c => (
                        <option key={c.id} value={c.id}>{c.name}</option>
                      ))}
                    </select>
                  </div>

                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="block text-slate-400 mb-1">Telpa / Virsma:</label>
                      <input 
                        type="text" 
                        placeholder="Piem. Viesistabas sienas" 
                        value={newColorEntry.room} 
                        onChange={e => setNewColorEntry({...newColorEntry, room: e.target.value})} 
                        class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white" 
                      />
                    </div>
                    <div>
                      <label class="block text-slate-400 mb-1">Ražotājs / Krāsas tips:</label>
                      <input 
                        type="text" 
                        placeholder="Piem. Tikkurila / Joker" 
                        value={newColorEntry.manufacturer} 
                        onChange={e => setNewColorEntry({...newColorEntry, manufacturer: e.target.value})} 
                        class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white" 
                      />
                    </div>
                  </div>

                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="block text-slate-400 mb-1">Krāsas nosaukums:</label>
                      <input 
                        type="text" 
                        placeholder="Piem. Balta / Pelēka" 
                        value={newColorEntry.colorName} 
                        onChange={e => setNewColorEntry({...newColorEntry, colorName: e.target.value})} 
                        class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white" 
                      />
                    </div>
                    <div>
                      <label class="block text-slate-400 mb-1">Precīzs RAL / Tonēšanas kods:</label>
                      <input 
                        type="text" 
                        placeholder="Piem. RAL 9010 vai NCS S 0502-Y" 
                        value={newColorEntry.ralCode} 
                        onChange={e => setNewColorEntry({...newColorEntry, ralCode: e.target.value})} 
                        class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-amber-400 font-bold" 
                      />
                    </div>
                  </div>

                  <button onClick={addColorEntry} class="w-full bg-amber-500 text-slate-950 font-bold py-2 rounded text-xs hover:bg-amber-400 mt-2">Saglabāt krāsu datubāzē</button>
                </div>

                <div class="space-y-3">
                  <h3 class="text-amber-500 font-bold text-sm">📋 SAGLABĀTO KRĀSU UN TOŅU SARAKSTS</h3>
                  {clientColors.length === 0 ? (
                    <div class="text-xs text-slate-500 italic text-center py-4 bg-slate-800/40 rounded-xl border border-slate-800">Nav saglabātu krāsu ierakstu</div>
                  ) : (
                    clientColors.map(item => {
                      const clientObj = clients.find(c => c.id === Number(item.clientId));
                      return (
                        <div key={item.id} class="bg-slate-800 p-3 rounded-xl border border-slate-700 text-xs space-y-1.5 flex justify-between items-start">
                          <div class="space-y-1">
                            <div class="font-bold text-amber-300 text-sm">👤 {clientObj ? clientObj.name : 'Nezināms klientiņš'}</div>
                            <div class="text-slate-300 font-medium">🏠 Telpa: {item.room}</div>
                            <div class="text-slate-400">Ražotājs: {item.manufacturer || '-'} | Krāsa: {item.colorName || '-'}</div>
                            <div class="text-amber-400 font-bold font-mono">Tonis / RAL: {item.ralCode}</div>
                          </div>
                          <button onClick={() => deleteColorEntry(item.id)} class="bg-red-900/40 hover:bg-red-800 text-red-300 px-2 py-1 rounded border border-red-700/50">🗑️</button>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            )}

            {/* UZDEVUMI */}
            {activeTab === 'uzdevumi' && (
              <div class="space-y-4">
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3 text-xs">
                  <h3 class="text-amber-500 font-bold text-sm">✅ PIEVIENOT JAUNU UZDEVUMU</h3>
                  <div class="flex gap-2">
                    <input 
                      type="text" 
                      placeholder="Ievadiet uzdevumu..." 
                      value={newTask} 
                      onChange={e => setNewTask(e.target.value)} 
                      class="flex-1 bg-slate-900 border border-slate-700 rounded p-2 text-white" 
                    />
                    <button onClick={() => {
                      if (!newTask) return;
                      setTasks([...tasks, { id: Date.now(), text: newTask, done: false }]);
                      setNewTask('');
                    }} class="bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded">Pievienot</button>
                  </div>
                </div>

                <div class="space-y-2">
                  <h3 class="text-amber-500 font-bold text-sm">📝 AKTĪVIE UZDEVUMI</h3>
                  {tasks.map(t => (
                    <div key={t.id} class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex items-center justify-between text-xs">
                      <div class="flex items-center gap-2">
                        <input type="checkbox" checked={t.done} onChange={() => {
                          setTasks(tasks.map(item => item.id === t.id ? {...item, done: !item.done} : item));
                        }} class="w-4 h-4 accent-amber-500" />
                        <span class={t.done ? 'line-through text-slate-500' : 'text-slate-200 font-medium'}>{t.text}</span>
                      </div>
                      <button onClick={() => deleteTask(t.id)} class="text-red-400 hover:text-red-300">🗑️</button>
                    </div>
                  ))}
                </div>

                {trash.length > 0 && (
                  <div class="space-y-2 pt-4 border-t border-slate-800">
                    <div class="flex justify-between items-center">
                      <h3 class="text-slate-400 font-bold text-xs">🗑️ MISKASTE ({trash.length})</h3>
                      <button onClick={emptyTrash} class="text-red-400 hover:text-red-300 text-[10px]">Iztukšot miskasti</button>
                    </div>
                    {trash.map(t => (
                      <div key={t.id} class="bg-slate-900/60 p-2.5 rounded-lg border border-slate-800 flex items-center justify-between text-xs text-slate-500">
                        <span class="line-through">{t.text}</span>
                        <button onClick={() => restoreTask(t.id)} class="text-blue-400 hover:text-blue-300 text-[11px]">Atjaunot</button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<CraftMateApp />, document.getElementById('root'));
  </script>
</body>
</html>
