<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CraftMate - AS Craft SIA & Aleksandrs Sjomkins</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .blueprint-bg {
      background-color: #0f172a;
      background-image: 
        linear-gradient(rgba(59, 130, 246, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59, 130, 246, 0.1) 1px, transparent 1px);
      background-size: 20px 20px;
    }
  </style>
</head>
<body class="blueprint-bg text-slate-100 font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const MASTER_SERVICES = [
      { id: 'est1', cat: 'Grīda', name: 'Estrich grīdas ierīkošana līdz 8cm biezumam', price: 19.36, unit: 'm²' },
      { id: 'pol1', cat: 'Griesti', name: 'Poliuretāna karnīzes montāža', price: 21.00, unit: 't/m' },
      { id: 'pol2', cat: 'Grīda', name: 'Poliuretāna grīdlīstes montāža', price: 17.00, unit: 't/m' },
      { id: 's8', cat: 'Sienas', name: 'Sienas špaktelēšana', price: 12.64, unit: 'm²' },
      { id: 's13', cat: 'Sienas', name: 'Krāsošana 2 kārtās', price: 8.23, unit: 'm²' },
      { id: 'gr12', cat: 'Grīda', name: 'Lamināta ieklāšana', price: 10.89, unit: 'm²' },
      { id: 'm1', cat: 'Mehānismi', name: 'Zemes rakšana ar traktortehniku', price: 61.23, unit: 'Stunda' },
      { id: 'm3', cat: 'Mehānismi', name: 'Būvgružu izvešana / iznešana', price: 17.18, unit: 'm³' }
    ];

    const REKVIZITI = {
      vards: "Aleksandrs Sjomkins",
      adrese: "Skolas iela 4, Iecava, Bauskas nov., LV-3913",
      pknr: "11068413308",
      banka: "A/S \"Swedbank\"",
      kod: "HABALV22",
      konts: "LV25HABA0551062884182"
    };

    function CraftMateApp() {
      const [activeTab, setActiveTab] = useState('tames');
      const [taxMode, setTaxMode] = useState('mun');
      
      const [clients] = useState([
        { id: 1, name: 'SIA "Ostiopātiskās medicīnas attīstības centrs"', regNr: '40003887484', address: 'Airu iela 39d, Rīga, LV-1015', banka: 'AS Magnetiq bank', konts: 'LV76LAPB0000146058803' },
        { id: 2, name: 'Jānis Bērziņš (Privātpersona)', regNr: '-', address: 'Brīvības iela 45, Rīga', banka: 'Swedbank', konts: 'LV00HABA1234567890123' }
      ]);

      const [selectedClient, setSelectedClient] = useState(clients[0]);
      const [selectedServices, setSelectedServices] = useState([
        { id: 'est1', qty: 45 },
        { id: 'pol1', qty: 18 }
      ]);

      const [tasks, setTasks] = useState([
        { id: 1, text: 'Saskaņot krāsu toņus objektā', done: true },
        { id: 2, text: 'Atvest Estrich smiltis un cementu', done: false }
      ]);
      const [newTask, setNewTask] = useState('');

      const updateQty = (id, val) => {
        const num = Number(val) || 0;
        setSelectedServices(selectedServices.map(s => s.id === id ? { ...s, qty: num } : s));
      };

      const addTask = () => {
        if (!newTask) return;
        setTasks([...tasks, { id: Date.now(), text: newTask, done: false }]);
        setNewTask('');
      };

      let subtotal = 0;
      const itemsCalculated = selectedServices.map(sel => {
        const srv = MASTER_SERVICES.find(m => m.id === sel.id);
        if (!srv) return null;
        const total = srv.price * sel.qty;
        subtotal += total;
        return { ...srv, qty: sel.qty, total };
      }).filter(Boolean);

      const vatTotal = taxMode === 'pvn' ? subtotal * 0.21 : 0;
      const grandTotal = subtotal + vatTotal;

      return (
        <div class="max-w-2xl mx-auto bg-slate-900/95 text-slate-100 min-h-screen pb-20 border-x border-blue-500/30 shadow-2xl">
          {/* Header ar inženiertehnisko dizainu */}
          <header class="p-4 bg-slate-950 border-b border-blue-500/40 relative overflow-hidden">
            <div class="absolute -right-4 -top-4 opacity-10 text-6xl font-mono text-blue-400 select-none">📐 CAD 2026</div>
            <div class="flex justify-between items-center relative z-10">
              <div>
                <h1 class="text-xl font-black text-amber-500 tracking-wider">AS CRAFT <span class="text-blue-400 font-light">| Engineering</span></h1>
                <p class="text-xs text-slate-400">Izpildītājs: <span class="text-slate-200 font-bold">{REKVIZITI.vards}</span></p>
              </div>
              <div class="flex items-center gap-1 bg-slate-900 p-1 rounded-lg border border-slate-700 text-xs">
                <button onClick={() => setTaxMode('pvn')} class={`px-2 py-1 rounded ${taxMode === 'pvn' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400'}`}>PVN 21%</button>
                <button onClick={() => setTaxMode('mun')} class={`px-2 py-1 rounded ${taxMode === 'mun' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400'}`}>Bez PVN</button>
              </div>
            </div>

            {/* Navigācijas izvēlne augšā */}
            <nav class="grid grid-cols-5 gap-1 mt-4 pt-3 border-t border-slate-800 text-center text-xs font-semibold">
              <button onClick={() => setActiveTab('tames')} class={`p-2 rounded ${activeTab === 'tames' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}`}>📋 Tāme</button>
              <button onClick={() => setActiveTab('rekini')} class={`p-2 rounded ${activeTab === 'rekini' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}`}>📑 Rēķini</button>
              <button onClick={() => setActiveTab('klienti')} class={`p-2 rounded ${activeTab === 'klienti' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}`}>👥 Klienti</button>
              <button onClick={() => setActiveTab('foto')} class={`p-2 rounded ${activeTab === 'foto' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}`}>🖼️ Plāni/Foto</button>
              <button onClick={() => setActiveTab('uzdevumi')} class={`p-2 rounded ${activeTab === 'uzdevumi' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}`}>✅ Uzdevumi</button>
            </nav>
          </header>

          <main class="p-4 space-y-6">
            {/* TĀMES SADAĻA */}
            {activeTab === 'tames' && (
              <div class="space-y-4">
                <div class="bg-slate-800/80 p-3 rounded-lg border border-blue-500/30 flex justify-between items-center text-xs">
                  <span>Izvēlētais klients: <strong class="text-amber-400">{selectedClient.name}</strong></span>
                  <button onClick={() => setActiveTab('klienti')} class="text-blue-400 underline">Mainīt</button>
                </div>

                <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700 space-y-3">
                  <h3 class="text-amber-500 font-bold text-sm">🛠️ IZVĒLĒTIE DARBI & APJOMI</h3>
                  {itemsCalculated.map(item => (
                    <div key={item.id} class="bg-slate-900 p-3 rounded border border-slate-800 flex justify-between items-center text-sm">
                      <div>
                        <div class="font-medium text-slate-200">{item.name}</div>
                        <div class="text-xs text-slate-400">{item.price.toFixed(2)} € / {item.unit}</div>
                      </div>
                      <div class="flex items-center gap-3">
                        <input type="number" value={item.qty} onChange={e => updateQty(item.id, e.target.value)} class="w-16 bg-slate-800 border border-slate-700 rounded p-1 text-center font-bold text-amber-400" />
                        <span class="font-mono text-amber-400 w-20 text-right">{item.total.toFixed(2)} €</span>
                      </div>
                    </div>
                  ))}
                </div>

                <div class="bg-slate-950 p-4 rounded-xl border border-amber-500/40 text-right font-mono space-y-1">
                  <div class="text-xs text-slate-400">Summa kopā: {subtotal.toFixed(2)} €</div>
                  <div class="text-lg font-bold text-amber-500">KOPĀ APMAKSAI: {grandTotal.toFixed(2)} €</div>
                </div>
              </div>
            )}

            {/* RĒĶINU SADAĻA (Pēc oficiālā parauga) */}
            {activeTab === 'rekini' && (
              <div class="bg-white text-slate-900 p-6 rounded-xl shadow-2xl space-y-4 font-serif text-sm">
                <div class="text-center font-bold text-base">
                  Rēķins Nr.: 271025
                  <div class="text-xs font-normal text-slate-600 mt-0.5">2026.gada 27.oktobri</div>
                </div>

                <div class="grid grid-cols-2 gap-4 text-xs pt-2">
                  <div>
                    <strong class="block border-b border-slate-300 pb-1 mb-1">Maksātājs:</strong>
                    <div>{selectedClient.name}</div>
                    <div>Adrese: {selectedClient.address}</div>
                    <div>Rēģ.Nr. {selectedClient.regNr}</div>
                    <div>Banka: {selectedClient.banka}</div>
                    <div>Konta Nr. {selectedClient.konts}</div>
                  </div>
                  <div>
                    <strong class="block border-b border-slate-300 pb-1 mb-1">Saņēmējs:</strong>
                    <div>{REKVIZITI.vards}</div>
                    <div>Adrese: {REKVIZITI.adrese}</div>
                    <div>Nod.maks.Nr. {REKVIZITI.pknr}</div>
                    <div>Banka: {REKVIZITI.banka}</div>
                    <div>Konta Nr. {REKVIZITI.konts}</div>
                  </div>
                </div>

                <table class="w-full text-xs border-collapse border border-slate-400 mt-4">
                  <thead>
                    <tr class="bg-amber-300">
                      <th class="border border-slate-400 p-1 text-center">Nr.</th>
                      <th class="border border-slate-400 p-1 text-left">Nosaukums</th>
                      <th class="border border-slate-400 p-1 text-center">Mērvienība</th>
                      <th class="border border-slate-400 p-1 text-center">Daudzums</th>
                      <th class="border border-slate-400 p-1 text-right">Summa, EUR</th>
                    </tr>
                  </thead>
                  <tbody>
                    {itemsCalculated.map((it, idx) => (
                      <tr key={it.id}>
                        <td class="border border-slate-400 p-1 text-center">{idx + 1}.</td>
                        <td class="border border-slate-400 p-1">{it.name}</td>
                        <td class="border border-slate-400 p-1 text-center">{it.unit}</td>
                        <td class="border border-slate-400 p-1 text-center">{it.qty}</td>
                        <td class="border border-slate-400 p-1 text-right">{it.total.toFixed(2)} EUR</td>
                      </tr>
                    ))}
                    <tr>
                      <td colSpan="4" class="border border-slate-400 p-1 text-right font-bold">Summa:</td>
                      <td class="border border-slate-400 p-1 text-right font-bold">{grandTotal.toFixed(2)} EUR</td>
                    </tr>
                  </tbody>
                </table>

                <div class="text-xs pt-2">
                  <strong>Summa vārdiem:</strong> pieci simti divi eiro 40 centi.
                </div>
                <div class="text-xs font-bold pt-1">
                  Samaksas termiņš līdz: 2026.gada 30. oktobrim.
                </div>
                <div class="text-xs italic text-center pt-6 text-slate-600">
                  Šis rēķins ir sagatavots elektroniski un derīgs bez paraksta
                </div>

                <button onClick={() => window.print()} class="w-full bg-slate-900 text-white py-2 rounded font-sans text-xs font-bold mt-4">🖨️ Drukāt / Saglabāt PDF Rēķinu</button>
              </div>
            )}

            {/* KLIENTU SADAĻA */}
            {activeTab === 'klienti' && (
              <div class="space-y-3">
                <h3 class="text-amber-500 font-bold text-sm">👥 MANI KLIENTI</h3>
                <div class="space-y-2">
                  {clients.map(c => (
                    <div key={c.id} onClick={() => setSelectedClient(c)} class={`p-3 rounded-lg border text-sm cursor-pointer transition-all ${selectedClient.id === c.id ? 'bg-amber-500/20 border-amber-500' : 'bg-slate-800 border-slate-700'}`}>
                      <div class="font-bold text-slate-100">{c.name}</div>
                      <div class="text-xs text-slate-400">{c.address} | Rēģ.Nr: {c.regNr}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* PLĀNU & FOTO SADAĻA */}
            {activeTab === 'foto' && (
              <div class="space-y-4 text-center py-6 border-2 border-dashed border-slate-700 rounded-xl bg-slate-800/40">
                <div class="text-4xl">📐</div>
                <div class="text-sm text-slate-300 font-semibold">Objekta rasējumi, plāni un fotogrāfijas</div>
                <p class="text-xs text-slate-500 max-w-xs mx-auto">Ielādējiet objekta skices vai pašreizējo stāvokli, lai viss atrastos vienuviet.</p>
                <input type="file" class="hidden" id="fileUp" />
                <label htmlFor="fileUp" class="inline-block bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-4 py-2 rounded cursor-pointer">Pievienot Failu / Foto</label>
              </div>
            )}

            {/* MANI UZDEVUMI SADAĻA */}
            {activeTab === 'uzdevumi' && (
              <div class="space-y-3">
                <h3 class="text-amber-500 font-bold text-sm">✅ OBJEKTA UZDEVUMI</h3>
                <div class="flex gap-2">
                  <input type="text" value={newTask} onChange={e => setNewTask(e.target.value)} placeholder="Jauns uzdevums..." class="flex-1 bg-slate-800 border border-slate-700 rounded p-2 text-xs text-slate-200 outline-none" />
                  <button onClick={addTask} class="bg-amber-500 text-slate-950 font-bold px-3 text-xs rounded">Pievienot</button>
                </div>
                <div class="space-y-2 pt-2">
                  {tasks.map(t => (
                    <div key={t.id} class="flex items-center gap-2 p-2 bg-slate-800/60 rounded border border-slate-700 text-xs">
                      <input type="checkbox" checked={t.done} onChange={() => setTasks(tasks.map(x => x.id === t.id ? {...x, done: !x.done} : x))} class="rounded" />
                      <span class={t.done ? 'line-through text-slate-500' : 'text-slate-200'}>{t.text}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CraftMateApp />);
  </script>
</body>
</html>
