Tāmes sadaļā tagad ir pievienotas divas jaunas, noderīgas pogas: "Saglabāt PDF" un "Sūtīt uz WhatsApp", kas ļauj gatavo dokumentu uzreiz ērti saglabāt failā vai nosūtīt klientam.
Zemāk ir pilns, atjauninātais CraftMate kods:
<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftMate - Būvniecības un Tāmju Pārvaldība</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- html2pdf.js for direct PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Noklusētais būvniecības un remontdarbu cenrādis
        const defaultCatalog = [
            { id: 1, category: "Demontāža", name: "Sienu demontāža (ģipškartons / koks)", unit: "m²", price: 8.00 },
            { id: 2, category: "Demontāža", name: "Grīdas seguma demontāža (lamināts / parkets)", unit: "m²", price: 5.00 },
            { id: 3, category: "Demontāža", name: "Flīžu demontāža", unit: "m²", price: 10.00 },
            { id: 4, category: "Sienas un griesti", name: "Starpsienu izbūvbe no metāla karkasa un ģipškartona (2 kārtas)", unit: "m²", price: 25.00 },
            { id: 5, category: "Sienas un griesti", name: "Sienu un griestu špaktelēšana un slīpēšana", unit: "m²", price: 14.00 },
            { id: 6, category: "Sienas un griesti", name: "Sienu krāsošana (2 kārtas)", unit: "m²", price: 6.50 },
            { id: 7, category: "Sienas un griesti", name: "Flīžu ieklāšana sienām", unit: "m²", price: 28.00 },
            { id: 8, category: "Grīda", name: "Pašizlīdzinošā grīdas maisījuma ieklāšana (Estrich / pašizlīdzinošais)", unit: "m²", price: 10.00 },
            { id: 9, category: "Grīda", name: "Lamināta vai parketa dēļu ieklāšana", unit: "m²", price: 9.00 },
            { id: 10, category: "Grīda", name: "Grīdlīstu montāža", unit: "m", price: 4.50 },
            { id: 11, category: "Santehnika", name: "Ūdensvada un kanalizācijas punkta izbūvbe", unit: "gab", price: 45.00 },
            { id: 12, category: "Santehnika", name: "Izlietnes / WC poda uzstādīšana", unit: "gab", price: 50.00 },
            { id: 13, category: "Elektriķa darbi", name: "Elektroinstalācijas punkta izveide (rozeta / slēdzis)", unit: "gab", price: 15.00 },
            { id: 14, category: "Elektriķa darbi", name: "Gaismas ķermeņa (lampas) montāža", unit: "gab", price: 20.00 }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('estimate');
            const estimateRef = useRef(null);
            
            // Dati
            const [catalog, setCatalog] = useState(() => {
                const saved = localStorage.getItem('craftmate_catalog');
                return saved ? JSON.parse(saved) : defaultCatalog;
            });

            const [clients, setClients] = useState(() => {
                const saved = localStorage.getItem('craftmate_clients');
                return saved ? JSON.parse(saved) : [
                    { id: 1, name: "Taņa", phone: "+371 20000000", email: "tana@epasts.lv", address: "Rīga, Centrs", notes: "Dzīvokļa pilna renovācija", colors: [{room: "Viesistaba", code: "RAL 9010", notes: "Sienas"}] }
                ];
            });

            const [estimateItems, setEstimateItems] = useState([]);
            const [selectedClient, setSelectedClient] = useState('');
            const [settings, setSettings] = useState({
                companyName: "AS Craft SIA",
                regNumber: "LV40000000000",
                address: "Iecava, Latvija",
                bank: "AS Swedbank",
                account: "LV33HABA0000000000000",
                pvnRate: 0,
                includeVat: false
            });

            // Jauna klienta forma
            const [newClientForm, setNewClientForm] = useState({ name: '', phone: '', email: '', address: '', notes: '' });
            const [selectedClientForColors, setSelectedClientForColors] = useState(null);
            const [newColorForm, setNewColorForm] = useState({ room: '', code: '', notes: '' });

            // Saglabāšana LocalStorage
            useEffect(() => {
                localStorage.setItem('craftmate_catalog', JSON.stringify(catalog));
            }, [catalog]);

            useEffect(() => {
                localStorage.setItem('craftmate_clients', JSON.stringify(clients));
            }, [clients]);

            // Aprēķini
            const subtotal = estimateItems.reduce((acc, item) => acc + (item.price * item.quantity), 0);
            const vatAmount = settings.includeVat ? subtotal * (settings.pvnRate / 100) : 0;
            const total = subtotal + vatAmount;

            // Pievienot preci tāmei
            const addToEstimate = (catItem) => {
                const existing = estimateItems.find(i => i.id === catItem.id);
                if (existing) {
                    setEstimateItems(estimateItems.map(i => i.id === catItem.id ? {...i, quantity: i.quantity + 1} : i));
                } else {
                    setEstimateItems([...estimateItems, { ...catItem, quantity: 1 }]);
                }
            };

            const updateQuantity = (id, qty) => {
                if (qty <= 0) {
                    setEstimateItems(estimateItems.filter(i => i.id !== id));
                } else {
                    setEstimateItems(estimateItems.map(i => i.id === id ? {...i, quantity: qty} : i));
                }
            };

            const handleAddClient = (e) => {
                e.preventDefault();
                if(!newClientForm.name) return;
                const clientObj = {
                    id: Date.now(),
                    ...newClientForm,
                    colors: []
                };
                setClients([...clients, clientObj]);
                setNewClientForm({ name: '', phone: '', email: '', address: '', notes: '' });
            };

            const handleAddColorToClient = (e) => {
                e.preventDefault();
                if(!selectedClientForColors || !newColorForm.code) return;
                const updated = clients.map(client => {
                    if(client.id === selectedClientForColors) {
                        return {
                            ...client,
                            colors: [...(client.colors || []), { ...newColorForm, id: Date.now() }]
                        };
                    }
                    return client;
                });
                setClients(updated);
                setNewColorForm({ room: '', code: '', notes: '' });
            };

            const deleteClient = (id) => {
                setClients(clients.filter(c => c.id !== id));
                if(selectedClientForColors === id) setSelectedClientForColors(null);
            };

            // PDF saglabāšanas funkcija
            const downloadPDF = () => {
                const element = estimateRef.current;
                const clientObj = clients.find(c => c.name === selectedClient);
                const clientNameClean = clientObj ? clientObj.name.replace(/[^a-zA-Z0-9]/g, '_') : 'Tame';
                const opt = {
                    margin:       10,
                    filename:     `Tame_${clientNameClean}_${new Date().toISOString().slice(0,10)}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2, useCORS: true },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                html2pdf().from(element).set(opt).save();
            };

            // Sūtīt uz WhatsApp funkcija
            const sendWhatsApp = () => {
                const clientObj = clients.find(c => c.name === selectedClient);
                const phone = clientObj ? clientObj.phone.replace(/[^0-9+]/g, '') : '';
                
                let text = `Labdien! Aprēķinātā tāme no ${settings.companyName}:\n`;
                estimateItems.forEach(item => {
                    text += `- ${item.name}: ${item.quantity} ${item.unit} x ${item.price.toFixed(2)} € = ${(item.quantity * item.price).toFixed(2)} €\n`;
                });
                text += `\nKOPĀ apmaksai: ${total.toFixed(2)} €`;

                const encoded = encodeURIComponent(text);
                const url = phone ? `https://wa.me/${phone}?text=${encoded}` : `https://wa.me/?text=${encoded}`;
                window.open(url, '_blank');
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Augšējā navigācija */}
                    <header className="bg-slate-900 text-white shadow-md">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-2">
                                <i data-lucide="hard-hat" className="w-8 h-8 text-amber-500"></i>
                                <span className="text-2xl font-bold tracking-wider">Craft<span className="text-amber-500">Mate</span></span>
                            </div>
                            <nav className="flex flex-wrap gap-2">
                                <button onClick={() => setActiveTab('estimate')} className={`px-4 py-2 rounded-lg font-medium transition flex items-center gap-2 ${activeTab === 'estimate' ? 'bg-amber-500 text-slate-950' : 'hover:bg-slate-800 text-slate-300'}`}>
                                    <i data-lucide="file-text" className="w-4 h-4"></i> Tāme & Rēķins
                                </button>
                                <button onClick={() => setActiveTab('catalog')} className={`px-4 py-2 rounded-lg font-medium transition flex items-center gap-2 ${activeTab === 'catalog' ? 'bg-amber-500 text-slate-950' : 'hover:bg-slate-800 text-slate-300'}`}>
                                    <i data-lucide="list-tree" className="w-4 h-4"></i> Darbu Katalogs
                                </button>
                                <button onClick={() => setActiveTab('clients')} className={`px-4 py-2 rounded-lg font-medium transition flex items-center gap-2 ${activeTab === 'clients' ? 'bg-amber-500 text-slate-950' : 'hover:bg-slate-800 text-slate-300'}`}>
                                    <i data-lucide="users" className="w-4 h-4"></i> Klienti & Toņi
                                </button>
                            </nav>
                        </div>
                    </header>

                    {/* Galvenais saturs */}
                    <main className="flex-grow max-w-7xl w-full mx-auto px-4 py-6">
                        
                        {/* 1. TĀMES UN RĒĶINA SADAĻA */}
                        {activeTab === 'estimate' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                {/* Kreisā puse: Katalogs izvēlei */}
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 lg:col-span-1">
                                    <h2 className="text-lg font-semibold mb-4 text-slate-800 flex items-center gap-2">
                                        <i data-lucide="plus-circle" className="w-5 h-5 text-amber-600"></i> Pievienot darbus
                                    </h2>
                                    <div className="space-y-3 max-h-[600px] overflow-y-auto pr-1">
                                        {catalog.map(item => (
                                            <div key={item.id} className="p-3 bg-slate-50 border border-slate-200 rounded-lg hover:border-amber-400 transition flex justify-between items-center">
                                                <div>
                                                    <span className="text-xs font-semibold px-2 py-0.5 bg-slate-200 text-slate-700 rounded">{item.category}</span>
                                                    <p className="font-medium text-sm mt-1 text-slate-900">{item.name}</p>
                                                    <p className="text-xs text-slate-500">{item.price.toFixed(2)} € / {item.unit}</p>
                                                </div>
                                                <button onClick={() => addToEstimate(item)} className="bg-slate-900 hover:bg-amber-600 text-white p-2 rounded-lg transition">
                                                    <i data-lucide="plus" className="w-4 h-4"></i>
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Labā puse: Aktīvā Tāme / Rēķins */}
                                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 lg:col-span-2 flex flex-col justify-between">
                                    <div>
                                        {/* Šo konteineri konvertējam uz PDF */}
                                        <div ref={estimateRef} className="bg-white p-2">
                                            <div className="flex justify-between items-start border-b pb-4 mb-4">
                                                <div>
                                                    <h1 className="text-2xl font-bold text-slate-900">Būvdarbu Tāme / Rēķins</h1>
                                                    <p className="text-sm text-slate-500">{settings.companyName} | {settings.address} | Reģ.nr: {settings.regNumber}</p>
                                                </div>
                                                <div className="text-right">
                                                    <span className="text-xs font-semibold px-3 py-1 bg-amber-100 text-amber-800 rounded-full">Datums: {new Date().toLocaleDateString('lv-LV')}</span>
                                                </div>
                                            </div>

                                            {/* Klienta izvēle */}
                                            <div className="mb-4">
                                                <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Izvēlēties Klientu</label>
                                                <select 
                                                    value={selectedClient} 
                                                    onChange={(e) => setSelectedClient(e.target.value)}
                                                    className="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none"
                                                >
                                                    <option value="">-- Norādīt klientu --</option>
                                                    {clients.map(c => (
                                                        <option key={c.id} value={c.name}>{c.name} ({c.phone || c.address})</option>
                                                    ))}
                                                </select>
                                            </div>

                                            {/* Pozīciju tabula */}
                                            <div className="overflow-x-auto">
                                                <table className="w-full text-left text-sm mb-4">
                                                    <thead className="bg-slate-100 text-slate-700 uppercase text-xs">
                                                        <tr>
                                                            <th className="p-2.5 rounded-l-lg">Nosaukums</th>
                                                            <th className="p-2.5">Mērv.</th>
                                                            <th className="p-2.5">Daudz.</th>
                                                            <th className="p-2.5">Cena (€)</th>
                                                            <th className="p-2.5">Kopā (€)</th>
                                                            <th className="p-2.5 rounded-r-lg"></th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-100">
                                                        {estimateItems.length === 0 ? (
                                                            <tr>
                                                                <td colSpan="6" className="text-center py-8 text-slate-400">Tāmē pagaidām nav pievienota neviena pozīcija. Izvēlieties darbus no kataloga kreisajā pusē.</td>
                                                            </tr>
                                                        ) : (
                                                            estimateItems.map(item => (
                                                                <tr key={item.id} className="hover:bg-slate-50">
                                                                    <td className="p-2.5 font-medium text-slate-900">{item.name}</td>
                                                                    <td className="p-2.5 text-slate-600">{item.unit}</td>
                                                                    <td className="p-2.5">
                                                                        <input 
                                                                            type="number" 
                                                                            min="0.1" 
                                                                            step="1"
                                                                            value={item.quantity} 
                                                                            onChange={(e) => updateQuantity(item.id, parseFloat(e.target.value) || 0)}
                                                                            className="w-16 border rounded p-1 text-center text-sm"
                                                                        />
                                                                    </td>
                                                                    <td className="p-2.5 text-slate-600">{item.price.toFixed(2)}</td>
                                                                    <td className="p-2.5 font-semibold text-slate-900">{(item.price * item.quantity).toFixed(2)}</td>
                                                                    <td className="p-2.5 text-right no-print">
                                                                        <button onClick={() => updateQuantity(item.id, 0)} className="text-red-500 hover:text-red-700 p-1">
                                                                            <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                                        </button>
                                                                    </td>
                                                                </tr>
                                                            ))
                                                        )}
                                                    </tbody>
                                                </table>
                                            </div>

                                            {/* Kopsavilkums */}
                                            <div className="border-t pt-4 bg-slate-50 p-4 rounded-xl mt-4">
                                                <div className="flex justify-between items-center mb-2 text-sm text-slate-600">
                                                    <span>Summa bez PVN:</span>
                                                    <span className="font-semibold text-slate-900">{subtotal.toFixed(2)} €</span>
                                                </div>
                                                <div className="flex justify-between items-center mb-3 text-lg font-bold text-slate-900 border-t pt-2">
                                                    <span>Kopā apmaksai:</span>
                                                    <span className="text-amber-600">{total.toFixed(2)} €</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Darbību pogas */}
                                    <div className="flex flex-wrap gap-2 mt-4 pt-4 border-t">
                                        <button onClick={downloadPDF} disabled={estimateItems.length === 0} className="flex-1 bg-amber-500 hover:bg-amber-600 disabled:opacity-50 text-slate-950 py-2.5 px-4 rounded-lg font-bold transition flex justify-center items-center gap-2">
                                            <i data-lucide="download" className="w-4 h-4"></i> Saglabāt PDF
                                        </button>
                                        <button onClick={sendWhatsApp} disabled={estimateItems.length === 0} className="flex-1 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white py-2.5 px-4 rounded-lg font-medium transition flex justify-center items-center gap-2">
                                            <i data-lucide="message-circle" className="w-4 h-4"></i> Sūtīt uz WhatsApp
                                        </button>
                                        <button onClick={() => window.print()} disabled={estimateItems.length === 0} className="bg-slate-900 hover:bg-slate-800 disabled:opacity-50 text-white py-2.5 px-4 rounded-lg font-medium transition flex justify-center items-center gap-2">
                                            <i data-lucide="printer" className="w-4 h-4"></i> Drukāt
                                        </button>
                                        <button onClick={() => setEstimateItems([])} className="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2.5 rounded-lg font-medium transition">
                                            Notīrīt
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 2. KATALOGA SADAĻA */}
                        {activeTab === 'catalog' && (
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                <h2 className="text-xl font-bold mb-4 text-slate-900 flex items-center gap-2">
                                    <i data-lucide="list-tree" className="w-5 h-5 text-amber-600"></i> Darbu un pakalpojumu cenrādis
                                </h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {catalog.map(item => (
                                        <div key={item.id} className="p-4 border border-slate-200 rounded-xl bg-slate-50 flex flex-col justify-between">
                                            <div>
                                                <span className="text-xs font-semibold px-2 py-0.5 bg-amber-100 text-amber-800 rounded">{item.category}</span>
                                                <h3 className="font-semibold text-slate-900 mt-2">{item.name}</h3>
                                            </div>
                                            <div className="mt-4 flex justify-between items-center pt-3 border-t border-slate-200">
                                                <span className="font-bold text-slate-900">{item.price.toFixed(2)} € / {item.unit}</span>
                                                <button onClick={() => {
                                                    const newPrice = prompt("Ievadiet jaunu cenu:", item.price);
                                                    if(newPrice !== null) {
                                                        const p = parseFloat(newPrice);
                                                        if(!isNaN(p)) {
                                                            setCatalog(catalog.map(c => c.id === item.id ? {...c, price: p} : c));
                                                        }
                                                    }
                                                }} className="text-xs bg-slate-200 hover:bg-slate-300 text-slate-800 px-3 py-1.5 rounded font-medium transition">
                                                    Labot cenu
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 3. KLIENTU UN TOŅU SADAĻA */}
                        {activeTab === 'clients' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                {/* Pievienot jaunu klientu */}
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 lg:col-span-1">
                                    <h2 className="text-lg font-semibold mb-4 text-slate-800 flex items-center gap-2">
                                        <i data-lucide="user-plus" className="w-5 h-5 text-amber-600"></i> Pievienot jaunu klientu
                                    </h2>
                                    <form onSubmit={handleAddClient} className="space-y-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Vārds / Uzņēmums *</label>
                                            <input 
                                                type="text" 
                                                required
                                                value={newClientForm.name}
                                                onChange={(e) => setNewClientForm({...newClientForm, name: e.target.value})}
                                                className="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none"
                                                placeholder="Piem., Taņa"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Telefons</label>
                                            <input 
                                                type="text" 
                                                value={newClientForm.phone}
                                                onChange={(e) => setNewClientForm({...newClientForm, phone: e.target.value})}
                                                className="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none"
                                                placeholder="+371 20000000"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">E-pasts</label>
                                            <input 
                                                type="email" 
                                                value={newClientForm.email}
                                                onChange={(e) => setNewClientForm({...newClientForm, email: e.target.value})}
                                                className="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none"
                                                placeholder="klients@epasts.lv"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Objekta adrese</label>
                                            <input 
                                                type="text" 
                                                value={newClientForm.address}
                                                onChange={(e) => setNewClientForm({...newClientForm, address: e.target.value})}
                                                className="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none"
                                                placeholder="Iela 1, Pilsēta"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Piezīmes / Objekta apraksts</label>
                                            <textarea 
                                                rows="2"
                                                value={newClientForm.notes}
                                                onChange={(e) => setNewClientForm({...newClientForm, notes: e.target.value})}
                                                className="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none"
                                                placeholder="Papildus informācija..."
                                            ></textarea>
                                        </div>
                                        <button type="submit" className="w-full bg-slate-900 hover:bg-amber-600 text-white font-medium py-2.5 rounded-lg transition flex justify-center items-center gap-2">
                                            <i data-lucide="user-check" className="w-4 h-4"></i> Saglabāt Klientu
                                        </button>
                                    </form>
                                </div>

                                {/* Klientu un toņu saraksts */}
                                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 lg:col-span-2">
                                    <h2 className="text-xl font-bold mb-4 text-slate-900 flex items-center gap-2">
                                        <i data-lucide="users" className="w-5 h-5 text-amber-600"></i> Klientu datubāze un toņu uzskaite
                                    </h2>
                                    
                                    <div className="space-y-4 max-h-[650px] overflow-y-auto pr-2">
                                        {clients.length === 0 ? (
                                            <p className="text-slate-400 text-center py-8">Nav reģistrēts neviens klienta ieraksts.</p>
                                        ) : (
                                            clients.map(client => (
                                                <div key={client.id} className="border border-slate-200 rounded-xl p-4 bg-slate-50">
                                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-2 pb-3 border-b border-slate-200">
                                                        <div>
                                                            <h3 className="font-bold text-slate-900 text-lg">{client.name}</h3>
                                                            <p className="text-xs text-slate-500">{client.address} | {client.phone} | {client.email}</p>
                                                            {client.notes && <p className="text-xs text-slate-600 italic mt-0.5">{client.notes}</p>}
                                                        </div>
                                                        <div className="flex items-center gap-2">
                                                            <button 
                                                                onClick={() => setSelectedClientForColors(selectedClientForColors === client.id ? null : client.id)}
                                                                className="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1"
                                                            >
                                                                <i data-lucide="palette" className="w-3.5 h-3.5"></i> 
                                                                {selectedClientForColors === client.id ? 'Aizvērt toņus' : `Toņi (${client.colors ? client.colors.length : 0})`}
                                                            </button>
                                                            <button onClick={() => deleteClient(client.id)} className="text-red-500 hover:text-red-700 p-1.5">
                                                                <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                            </button>
                                                        </div>
                                                    </div>

                                                    {/* Klienta krāsu/toņu panelis */}
                                                    {selectedClientForColors === client.id && (
                                                        <div className="mt-4 pt-3 border-t border-dashed border-slate-300">
                                                            <h4 className="text-sm font-semibold text-slate-800 mb-2">Telpu toņi un krāsu kodi šim klientam:</h4>
                                                            
                                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-3">
                                                                {client.colors && client.colors.map(col => (
                                                                    <div key={col.id} className="bg-white p-2.5 rounded border border-slate-200 text-xs flex justify-between items-center">
                                                                        <div>
                                                                            <span className="font-semibold text-slate-900">{col.room}</span>: <span className="text-amber-700 font-bold">{col.code}</span>
                                                                            {col.notes && <span className="text-slate-500 block">({col.notes})</span>}
                                                                        </div>
                                                                        <button 
                                                                            onClick={() => {
                                                                                const updated = clients.map(c => {
                                                                                    if(c.id === client.id) {
                                                                                      return {...c, colors: c.colors.filter(x => x.id !== col.id)};
                                                                                    }
                                                                                    return c;
                                                                                });
                                                                                setClients(updated);
                                                                            }}
                                                                            className="text-red-400 hover:text-red-600"
                                                                        >
                                                                            <i data-lucide="x" className="w-3.5 h-3.5"></i>
                                                                        </button>
                                                                    </div>
                                                                ))}
                                                            </div>

                                                            <form onSubmit={handleAddColorToClient} className="flex flex-col sm:flex-row gap-2">
                                                                <input 
                                                                    type="text" 
                                                                    placeholder="Telpa (piem., Guļamistaba)" 
                                                                    required
                                                                    value={newColorForm.room}
                                                                    onChange={(e) => setNewColorForm({...newColorForm, room: e.target.value})}
                                                                    className="border rounded px-2 py-1.5 text-xs flex-1 outline-none focus:border-amber-500"
                                                                />
                                                                <input 
                                                                    type="text" 
                                                                    placeholder="Tonis / Kods (RAL 9010)" 
                                                                    required
                                                                    value={newColorForm.code}
                                                                    onChange={(e) => setNewColorForm({...newColorForm, code: e.target.value})}
                                                                    className="border rounded px-2 py-1.5 text-xs flex-1 outline-none focus:border-amber-500"
                                                                />
                                                                <input 
                                                                    type="text" 
                                                                    placeholder="Piezīme (matēta, Tikkurila)" 
                                                                    value={newColorForm.notes}
                                                                    onChange={(e) => setNewColorForm({...newColorForm, notes: e.target.value})}
                                                                    className="border rounded px-2 py-1.5 text-xs flex-1 outline-none focus:border-amber-500"
                                                                />
                                                                <button type="submit" className="bg-slate-900 hover:bg-amber-600 text-white text-xs px-3 py-1.5 rounded font-medium transition">
                                                                    Pievienot toni
                                                                </button>
                                                            </form>
                                                        </div>
                                                    )}
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* Kājiņa */}
                    <footer className="bg-slate-900 text-slate-400 py-4 text-center text-xs mt-auto">
                        <p>CraftMate &copy; 2026 — Profesionāls rīks būvniecības un remontdarbu vadībai.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
        
        setTimeout(() => {
            lucide.createIcons();
        }, 100);
    </script>
</body>
</html>
