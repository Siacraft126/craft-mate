      { id: 'san10', cat: 'Santehnika', name: 'Dušas trapu uzstādīšana', price: 159.72, unit: 'kompl' },

      // Mehānismi & Tehnika

      { id: 'm2', cat: 'Mehānismi', name: 'Zemes līdzināšana + traktortehnika', price: 51.91, unit: 'Stunda' },
      { id: 'm3', cat: 'Mehānismi', name: 'Būvgružu izvešana / iznešana', price: 17.18, unit: 'm³' },
      { id: 'm4', cat: 'Mehānismi', name: 'Sienas gāzes katla uzstādīšana', price: 653.40, unit: 'kompl' },
      { id: 'm5', cat: 'Mehānismi', name: 'Sadales skapja uzstādīšana/pieslēgšana', price: 346.06, unit: 'kompl' }
    ];

    function CraftMateApp() {
      const [taxMode, setTaxMode] = useState('pvn'); // 'pvn' (21%) vai 'mun' (0% PVN)
      const [client, setClient] = useState({
        name: 'Jānis Bērziņš',
        phone: '+371 20000000',
        title: 'Vannas istabas & Dzīvokļa remonts',
        address: 'Rīga, Brīvības iela 45',
        colors: 'Sienas: RAL 7016 (Dark Grey), Griesti: NCS S 0502-Y'
      });

      const [selectedServices, setSelectedServices] = useState([
        { id: 's8', qty: 25 },
        { id: 's13', qty: 25 },
        { id: 'gr12', qty: 18 }
      ]);

      const [expenses, setExpenses] = useState([
        { id: 1, title: 'Flīžu līme & Hidroizolācija', cost: 145.00 },
        { id: 2, title: 'Reģipša profili & Skrūves', cost: 82.50 }
      ]);

      const [newExpTitle, setNewExpTitle] = useState('');
      const [newExpCost, setNewExpCost] = useState('');

      const toggleService = (id) => {
        if (selectedServices.some(s => s.id === id)) {
          setSelectedServices(selectedServices.filter(s => s.id !== id));
        } else {
          setSelectedServices([...selectedServices, { id, qty: 10 }]);
        }
      };

      const updateQty = (id, val) => {
        const num = Number(val) || 0;
        setSelectedServices(selectedServices.map(s => s.id === id ? { ...s, qty: num } : s));
      };

      const addExpense = () => {
        if (!newExpTitle || !newExpCost) return;
        setExpenses([...expenses, { id: Date.now(), title: newExpTitle, cost: Number(newExpCost) }]);
        setNewExpTitle('');
        setNewExpCost('');
      };

      const removeExpense = (id) => {
        setExpenses(expenses.filter(e => e.id !== id));
      };

      // Aprēķini
      let subtotalWorks = 0;
      const itemsCalculated = selectedServices.map(sel => {
        const srv = MASTER_SERVICES.find(m => m.id === sel.id);
        if (!srv) return null;
        
        let finalPrice = srv.price;
        let isSmallVolume = false;

        // Ja m² apjoms ir zem 30m2, piemēro papildmaksu (+27.5%)
        if (srv.unit === 'm²' && sel.qty < 30 && sel.qty > 0) {
          finalPrice = srv.price * 1.275;
          isSmallVolume = true;
        }

        const total = finalPrice * sel.qty;
        subtotalWorks += total;

        return { ...srv, qty: sel.qty, finalPrice, total, isSmallVolume };
      }).filter(Boolean);

      const totalExpenses = expenses.reduce((sum, e) => sum + e.cost, 0);
      const vatRate = taxMode === 'pvn' ? 0.21 : 0.00;
      const vatTotal = subtotalWorks * vatRate;
      const grandTotal = subtotalWorks + vatTotal;

      return (
        <div class="max-w-xl mx-auto bg-slate-900 text-slate-100 min-h-screen pb-20 border-x border-slate-800">
          <header class="p-4 bg-slate-950 border-b border-slate-800 flex justify-between items-center sticky top-0 z-20">
            <div>
              <h1 class="text-xl font-black text-amber-500 tracking-wider">AS CRAFT <span class="text-slate-100 font-normal">| CraftMate</span></h1>
              <p class="text-xs text-slate-400">Tāmju un Objektu Vadības Sistēma</p>
            </div>
            
            <div class="flex items-center gap-1 bg-slate-800 p-1 rounded-lg border border-slate-700 text-xs">
              <button onClick={() => setTaxMode('pvn')} class={`px-2 py-1 rounded font-semibold ${taxMode === 'pvn' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}>PVN 21%</button>
              <button onClick={() => setTaxMode('mun')} class={`px-2 py-1 rounded font-semibold ${taxMode === 'mun' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}>Bez PVN (MUN)</button>
            </div>
          </header>

          <main class="p-4 space-y-6">
            {/* Klienta & Objekta informācija */}
            <section class="bg-slate-800/60 p-4 rounded-xl border border-slate-700 space-y-3">
              <div class="text-amber-500 font-bold text-sm tracking-wide">👤 KLIENTS & OBJEKTA KRĀSU KODI</div>
              <div class="grid grid-cols-1 gap-2 text-sm">
                <input type="text" value={client.title} onChange={e => setClient({...client, title: e.target.value})} class="bg-slate-900 border border-slate-700 rounded p-2 text-amber-400 font-bold focus:border-amber-500 outline-none" placeholder="Objekta nosaukums" />
                <div class="grid grid-cols-2 gap-2">
                  <input type="text" value={client.name} onChange={e => setClient({...client, name: e.target.value})} class="bg-slate-900 border border-slate-700 rounded p-2 text-slate-200 focus:border-amber-500 outline-none" placeholder="Klienta Vārds" />
                  <input type="text" value={client.phone} onChange={e => setClient({...client, phone: e.target.value})} class="bg-slate-900 border border-slate-700 rounded p-2 text-slate-200 focus:border-amber-500 outline-none" placeholder="Tālrunis" />
                </div>
                <input type="text" value={client.address} onChange={e => setClient({...client, address: e.target.value})} class="bg-slate-900 border border-slate-700 rounded p-2 text-slate-300 focus:border-amber-500 outline-none" placeholder="Objekta adrese" />
                
                {/* Krāsu toņu arhivēšana */}
                <div class="pt-2">
                  <label class="text-xs text-amber-400/90 font-semibold block mb-1">🎨 Saglabātie Krāsu Kodi / RAL toņi:</label>
                  <textarea value={client.colors} onChange={e => setClient({...client, colors: e.target.value})} rows="2" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-slate-300 focus:border-amber-500 outline-none" placeholder="Piemēram: Sienas RAL 7016, Klienta piedāvātās flīzes..."></textarea>
                </div>
              </div>
            </section>

            {/* Darbu Katalogs un Izvēlne */}
            <section class="bg-slate-800/60 p-4 rounded-xl border border-slate-700 space-y-4">
              <div class="flex justify-between items-center">
                <div class="text-amber-500 font-bold text-sm tracking-wide">🛠️ VEICAMO DARBU KATALOGS</div>
                <span class="text-xs bg-slate-900 text-slate-400 px-2 py-1 rounded border border-slate-700">Cenas bez PVN</span>
              </div>

              <div class="max-h-60 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
                {MASTER_SERVICES.map((srv) => {
                  const isSel = selectedServices.some(s => s.id === srv.id);
                  return (
                    <div key={srv.id} onClick={() => toggleService(srv.id)} class={`p-2.5 rounded-lg border text-sm flex items-center justify-between cursor-pointer transition-all ${isSel ? 'bg-amber-500/10 border-amber-500/50 text-amber-300' : 'bg-slate-900/60 border-slate-800 text-slate-300 hover:border-slate-700'}`}>
                      <div class="flex items-center gap-2">
                        <span>{isSel ? '✅' : '⬛'}</span>
                        <div>
                          <div class="font-medium">{srv.name}</div>
                          <div class="text-xs text-slate-400">[{srv.cat}] - {srv.price.toFixed(2)} € / {srv.unit}</div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </section>

            {/* Izvēlēto darbu saraksts un apjomu ievade */}
            <section class="bg-slate-800/60 p-4 rounded-xl border border-slate-700 space-y-3">
              <div class="text-amber-500 font-bold text-sm tracking-wide">📋 IZVĒLĒTĀS POZĪCIJAS & APJOMI</div>
              
              {itemsCalculated.length === 0 ? (
                <p class="text-xs text-slate-500 text-center py-4">Nav izvēlēta neviena darba pozīcija no kataloga.</p>
              ) : (
                <div class="space-y-3">
                  {itemsCalculated.map((item) => (
                    <div key={item.id} class="bg-slate-900 p-3 rounded-lg border border-slate-800 space-y-2">
                      <div class="flex justify-between items-start text-sm">
                        <div>
                          <div class="font-semibold text-slate-200">{item.name}</div>
                          <div class="text-xs text-slate-400">
                            Bāze: {item.price.toFixed(2)} € / {item.unit}
                            {item.isSmallVolume && <span class="text-amber-400 ml-1 font-semibold">(+27.5% maza apjoma piemaksa)</span>}
                          </div>
                        </div>
                        <div class="font-bold text-amber-400 font-mono text-base">{item.total.toFixed(2)} €</div>
                      </div>

                      <div class="flex items-center gap-2 pt-1 border-t border-slate-800/60">
                        <label class="text-xs text-slate-400">Ievadīt apjomu ({item.unit}):</label>
                        <input type="number" value={item.qty} onChange={(e) => updateQty(item.id, e.target.value)} class="w-24 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-amber-400 font-bold text-sm outline-none focus:border-amber-500" />
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </section>

            {/* Objekta izdevumi / Čeki */}
            <section class="bg-slate-800/60 p-4 rounded-xl border border-slate-700 space-y-3">
              <div class="flex justify-between items-center">
                <div class="text-amber-500 font-bold text-sm tracking-wide">🧾 OBJEKTA REĀLIE IZDEVUMI</div>
                <span class="text-xs text-slate-400">Kopā: {totalExpenses.toFixed(2)} €</span>
              </div>

              <div class="space-y-2">
                {expenses.map((e) => (
                  <div key={e.id} class="flex justify-between items-center p-2 bg-slate-900 rounded border border-slate-800 text-xs">
                    <span class="text-slate-300">{e.title}</span>
                    <div class="flex items-center gap-3">
                      <span class="font-mono text-amber-400">{e.cost.toFixed(2)} €</span>
                      <button onClick={() => removeExpense(e.id)} class="text-red-400 font-bold hover:text-red-300">✕</button>
                    </div>
                  </div>
                ))}
              </div>

              <div class="flex gap-2 pt-2">
                <input type="text" placeholder="Čeks / Materiāls" value={newExpTitle} onChange={e => setNewExpTitle(e.target.value)} class="flex-1 bg-slate-900 border border-slate-700 rounded p-2 text-xs text-slate-200 outline-none" />
                <input type="number" placeholder="Summa €" value={newExpCost} onChange={e => setNewExpCost(e.target.value)} class="w-24 bg-slate-900 border border-slate-700 rounded p-2 text-xs text-slate-200 outline-none" />
                <button onClick={addExpense} class="bg-amber-500 text-slate-950 font-bold px-3 py-1 rounded text-xs">Pievienot</button>
              </div>
            </section>

            {/* Kopējais aprēķins ar nodokļiem */}
            <section class="bg-slate-950 p-4 rounded-xl border border-amber-500/30 space-y-2 font-mono">
              <div class="flex justify-between text-xs text-slate-400">
                <span>Darbi kopā (bez PVN):</span>
                <span>{subtotalWorks.toFixed(2)} €</span>
              </div>

              {taxMode === 'pvn' ? (
                <div class="flex justify-between text-xs text-slate-400">
                  <span>PVN (21%):</span>
                  <span>{vatTotal.toFixed(2)} €</span>
                </div>
              ) : (
                <div class="flex justify-between text-xs text-emerald-400">
                  <span>Nodokļa režīms:</span>
                  <span>MUN / Bez PVN</span>
                </div>
              )}

              <div class="border-t border-slate-800 pt-2 flex justify-between font-bold text-xl text-amber-500">
                <span>GALA SUMMA:</span>
                <span>{grandTotal.toFixed(2)} €</span>
              </div>
            </section>

            <button onClick={() => window.print()} class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 transition-all shadow-lg shadow-amber-500/10">
              🖨️ Drukāt / Saglabāt Tāmi (PDF)
            </button>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CraftMateApp />);
  </script>
</body>
</html>
