<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darbu un izcenojumu tāme</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        .tame-container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }
        th, td {
            border: 1px solid #e0e0e0;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 6px 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        input[type="number"] {
            text-align: right;
        }
        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-add {
            background-color: #27ae60;
            color: white;
        }
        .btn-add:hover {
            background-color: #219150;
        }
        .btn-delete {
            background-color: #e74c3c;
            color: white;
            padding: 4px 8px;
        }
        .btn-delete:hover {
            background-color: #c0392b;
        }
        .summary-container {
            text-align: right;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="tame-container">
    <h2>Darbu un izcenojumu tāme</h2>

    <table id="tameTable">
        <thead>
            <tr>
                <th style="width: 35%;">Darba apraksts</th>
                <th style="width: 12%;">Daudzums</th>
                <th style="width: 15%;">Mērvienība</th>
                <th style="width: 15%;">Cena/vien. (€)</th>
                <th style="width: 15%;">Kopā (€)</th>
                <th style="width: 8%;">Darbība</th>
            </tr>
        </thead>
        <tbody id="tameBody">
            <tr>
                <td><input type="text" value="Grīdas sagatavošana un ieklāšana" placeholder="Darba nosaukums"></td>
                <td><input type="number" class="qty" value="50" min="0" step="any" oninput="calculateTame()"></td>
                <td>
                    <select>
                        <option value="m²" selected>m²</option>
                        <option value="m">m</option>
                        <option value="gab.">gab.</option>
                        <option value="kompl.">kompl.</option>
                        <option value="h">h</option>
                    </select>
                </td>
                <td><input type="number" class="price" value="12.00" min="0" step="0.01" oninput="calculateTame()"></td>
                <td><input type="text" class="total" value="0.00" readonly style="background-color: #f9f9f9; font-weight: bold; text-align: right;"></td>
                <td style="text-align: center;"><button class="btn btn-delete" onclick="deleteRow(this)">X</button></td>
            </tr>
        </tbody>
    </table>

    <button class="btn btn-add" onclick="addRow()">+ Pievienot darbu</button>

    <div class="summary-container">
        Kopā bez PVN: <span id="grandTotal">0.00</span> €
    </div>
</div>

<script>
    function addRow() {
        const tbody = document.getElementById('tameBody');
        const newRow = document.createElement('tr');

        newRow.innerHTML = `
            <td><input type="text" placeholder="Darba nosaukums"></td>
            <td><input type="number" class="qty" value="1" min="0" step="any" oninput="calculateTame()"></td>
            <td>
                <select>
                    <option value="m²">m²</option>
                    <option value="m">m</option>
                    <option value="gab.">gab.</option>
                    <option value="kompl.">kompl.</option>
                    <option value="h">h</option>
                </select>
            </td>
            <td><input type="number" class="price" value="0.00" min="0" step="0.01" oninput="calculateTame()"></td>
            <td><input type="text" class="total" value="0.00" readonly style="background-color: #f9f9f9; font-weight: bold; text-align: right;"></td>
            <td style="text-align: center;"><button class="btn btn-delete" onclick="deleteRow(this)">X</button></td>
        `;

        tbody.appendChild(newRow);
        calculateTame();
    }

    function deleteRow(button) {
        const row = button.closest('tr');
        row.remove();
        calculateTame();
    }

    function calculateTame() {
        const rows = document.querySelectorAll('#tameBody tr');
        let grandTotal = 0;

        rows.forEach(row => {
            const qtyInput = row.querySelector('.qty');
            const priceInput = row.querySelector('.price');
            const totalInput = row.querySelector('.total');

            const qty = parseFloat(qtyInput.value) || 0;
            const price = parseFloat(priceInput.value) || 0;

            const rowTotal = qty * price;
            totalInput.value = rowTotal.toFixed(2);

            grandTotal += rowTotal;
        });

        document.getElementById('grandTotal').textContent = grandTotal.toFixed(2);
    }

    window.onload = calculateTame;
</script>

</body>
</html>
