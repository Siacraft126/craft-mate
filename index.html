<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AS CRAFT | Engineering</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b1120;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

<div id="root"></div>

<script type="text/babel">
    const { useState } = React;

    function CraftApp() {
        const [pvnType, setPvnType] = useState('MUN');
        const [activeTab, setActiveTab] = useState('tame');
        const [search, setSearch] = useState('');
        const [category, setCategory] = useState('visas');

        // Manuālā darba pievienošana
        const [manualName, setManualName] = useState('');
        const [manualPrice, setManualPrice] = useState('');
        const [manualUnit, setManualUnit] = useState('m²');
        const [manualQty, setManualQty] = useState('1');

        // Sākotnējs katalogs
        const initialCatalog = [
            { id: 1, name: 'Laukakmeņu mūrēšanas darbi', cat: 'Sienas', price: 21.78, unit: 'St' },
            { id: 2, name: 'Daļējs sienas apmetums', cat: 'Sienas', price: 9.08, unit: 'm²' },
            { id: 3, name: 'Visas sienas apmetums (rokas darbs)', cat: 'Sienas', price: 10.29, unit: 'm²' },
            { id: 4, name: 'Sienas špaktelēšana', cat: 'Sienas', price: 12.64, unit: 'm²' },
            { id: 5, name: 'Griestu krāsošana', cat: 'Griesti', price: 8.50, unit: 'm²' },
            { id: 6, name: 'Grīdas ieklāšana', cat: 'Grida', price: 15.00, unit: 'm²' }
        ];

        // Tāmē iekļautie darbi
        const [tameItems, setTameItems] = useState([]);

        const addManualToTame = () => {
            if (!manualName) return;
            const newItem = {
                id: Date.now(),
                name: manualName,
                price: parseFloat(manualPrice) || 0,
                unit: manualUnit,
                qty: parseFloat(manualQty) || 1
            };
            setTameItems([...tameItems, newItem]);
            setManualName('');
            setManualPrice('');
            setManualQty('1');
        };

        const addCatalogToTame = (item) => {
            const newItem = {
                id: Date.now(),
                name: item.name,
                price: item.price,
                unit: item.unit,
                qty: 1
            };
            setTameItems([...tameItems, newItem]);
        };

        const updateTameItem = (id, field, val) => {
            setTameItems(tameItems.map(item => item.id === id ? { ...item, [field]: field === 'name' || field === 'unit' ? val : parseFloat(val) || 0 } : item));
        };

        const removeTameItem = (id) => {
            setTameItems(tameItems.filter(item => item.id !== id));
        };

        const filteredCatalog = initialCatalog.filter(c => {
            const matchesCat = category === 'visas' || c.cat.toLowerCase() === category.toLowerCase();
            const matchesSearch = c.name.toLowerCase().includes(search.toLowerCase());
            return matchesCat && matchesSearch;
        });

        const subtotal = tameItems.reduce((acc, item) => acc + (item.qty * item.price), 0);

        return (
            <div class="max-w-md mx-auto p-4 space-y-4">
                {/* Galvene */}
                <div class="flex justify-between items-start pt-2">
                    <div>
                        <h1 class="text-2xl font-black tracking-wide text-amber-500">
                            AS CRAFT <span class="text-blue-500 font-normal">|</span>
                        </h1>
                        <h2 class="text-xl font-bold text-blue-400 -mt-1">Engineering</h2>
                        <p class="text-xs text-slate-400 mt-1">Izpildītājs: <span class="font-semibold text-slate-200">Aleksandrs Sjomkins</span></p>
                    </div>

                    {/* Režīmu slēdži */}
                    <div class="bg-slate-900 border border-slate-800 p-1 rounded-xl flex gap-1">
                        <button 
                            onClick={() => setPvnType('PVN')} 
                            class={`px-3 py-1.5 text-xs font-bold rounded-lg transition ${pvnType === 'PVN' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}>
                            PVN<br/><span class="text-[10px] opacity-80">21%</span>
                        </button>
                        <button 
                            onClick={() => setPvnType('MUN')} 
                            class={`px-3 py-1.5 text-xs font-bold rounded-lg transition ${pvnType === 'MUN' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}>
                            MUN<br/><span class="text-[10px] opacity-80">25%</span>
                        </button>
                        <button 
                            onClick={() => setPvnType('BEZ')} 
                            class={`px-3 py-1.5 text-xs font-bold rounded-lg transition ${pvnType === 'BEZ' ? 'bg-slate-700 text-white' : 'text-slate-400'}`}>
                            Bez<br/><span class="text-[10px] opacity-80">PVN</span>
                        </button>
                    </div>
                </div>

                {/* Navigācija */}
                <div class="grid grid-cols-5 gap-1.5 bg-slate-900/80 p-1.5 border border-slate-800 rounded-xl">
                    <button onClick={() => setActiveTab('tame')} class={`flex flex-col items-center py-2 rounded-lg text-xs font-semibold ${activeTab === 'tame' ? 'bg-blue-600 text-white' : 'bg-slate-800/50 text-slate-400'}`}>
                        <i class="fa-solid font-bold fa-clipboard-list mb-1 text-sm"></i> Tāme
                    </button>
                    <button onClick={() => setActiveTab('rekini')} class={`flex flex-col items-center py-2 rounded-lg text-xs font-semibold ${activeTab === 'rekini' ? 'bg-blue-600 text-white' : 'bg-slate-800/50 text-slate-400'}`}>
                        <i class="fa-solid fa-file-invoice mb-1 text-sm"></i> Rēķini
                    </button>
                    <button onClick={() => setActiveTab('klienti')} class={`flex flex-col items-center py-2 rounded-lg text-xs font-semibold ${activeTab === 'klienti' ? 'bg-blue-600 text-white' : 'bg-slate-800/50 text-slate-400'}`}>
                        <i class="fa-solid fa-users mb-1 text-sm"></i> Klienti
                    </button>
                    <button onClick={() => setActiveTab('plani')} class={`flex flex-col items-center py-2 rounded-lg text-xs font-semibold ${activeTab === 'plani' ? 'bg-blue-600 text-white' : 'bg-slate-800/50 text-slate-400'}`}>
                        <i class="fa-solid fa-image mb-1 text-sm"></i> Plāni/Foto
                    </button>
                    <button onClick={() => setActiveTab('uzdevumi')} class={`flex flex-col items-center py-2 rounded-lg text-xs font-semibold ${activeTab === 'uzdevumi' ? 'bg-blue-600 text-white' : 'bg-slate-800/50 text-slate-400'}`}>
                        <i class="fa-solid fa-square-check mb-1 text-sm text-green-400"></i> Uzdevumi
                    </button>
                </div>

                {/* Meklētājs */}
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-sm"></i>
                    <input 
                        type="text" 
                        placeholder="Meklēt darbu..." 
                        value={search}
                        onChange={(e) => setSearch(e.target.value)}
                        class="w-full bg-slate-900/90 border border-slate-800 rounded-xl pl-9 pr-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500"
                    />
                </div>

                {/* Kategoriju filtri */}
                <div class="flex gap-2 overflow-x-auto pb-1 text-xs">
                    <button onClick={() => setCategory('visas')} class={`px-3 py-1.5 rounded-lg flex items-center gap-1.5 font-medium whitespace-nowrap ${category === 'visas' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-900 border border-slate-800 text-slate-300'}`}>
                        🌐 Visas
                    </button>
                    <button onClick={() => setCategory('sienas')} class={`px-3 py-1.5 rounded-lg flex items-center gap-1.5 font-medium whitespace-nowrap ${category === 'sienas' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-900 border border-slate-800 text-slate-300'}`}>
                        🧱 Sienas
                    </button>
                    <button onClick={() => setCategory('griesti')} class={`px-3 py-1.5 rounded-lg flex items-center gap-1.5 font-medium whitespace-nowrap ${category === 'griesti' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-900 border border-slate-800 text-slate-300'}`}>
                        🏠 Griesti
                    </button>
                    <button onClick={() => setCategory('grida')} class={`px-3 py-1.5 rounded-lg flex items-center gap-1.5 font-medium whitespace-nowrap ${category === 'grida' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-900 border border-slate-800 text-slate-300'}`}>
                        🪵 Grīda
                    </button>
                </div>

                {/* Pievienot citu darbu (Manuāli) */}
                <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-3.5 space-y-2.5">
                    <div class="flex items-center gap-2 text-xs font-bold text-amber-500 tracking-wide uppercase">
                        <i class="fa-solid fa-hammer text-slate-400"></i> Pievienot citu darbu (Manuāli)
                    </div>
                    <input 
                        type="text" 
                        placeholder="Darba nosaukums (piem. Būvgružu izvešana)" 
                        value={manualName}
                        onChange={(e) => setManualName(e.target.value)}
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500"
                    />
                    <div class="grid grid-cols-3 gap-2">
                        <input 
                            type="number" 
                            placeholder="Cena (€)" 
                            value={manualPrice}
                            onChange={(e) => setManualPrice(e.target.value)}
                            class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500"
                        />
                        <select 
                            value={manualUnit}
                            onChange={(e) => setManualUnit(e.target.value)}
                            class="bg-slate-950 border border-slate-800 rounded-lg px-2 py-2 text-sm text-white focus:outline-none focus:border-blue-500"
                        >
                            <option value="m²">m²</option>
                            <option value="m">m</option>
                            <option value="gab.">gab.</option>
                            <option value="St">St</option>
                            <option value="kompl.">kompl.</option>
                        </select>
                        <input 
                            type="number" 
                            placeholder="1" 
                            value={manualQty}
                            onChange={(e) => setManualQty(e.target.value)}
                            class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500 text-center"
                        />
                    </div>
                    <button 
                        onClick={addManualToTame}
                        class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-lg text-xs flex items-center justify-center gap-2 transition"
                    >
                        <i class="fa-solid fa-plus"></i> Pievienot darbu tāmē
                    </button>
                </div>

                {/* Katalogs */}
                <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-3.5 space-y-2.5">
                    <div class="flex items-center gap-2 text-xs font-bold text-amber-500 uppercase tracking-wide">
                        <i class="fa-solid fa-screwdriver-wrench"></i> Katalogs ({category === 'visas' ? 'Visas' : category})
                    </div>
                    <div class="space-y-2 max-h-60 overflow-y-auto pr-1">
                        {filteredCatalog.map(item => (
                            <div key={item.id} onClick={() => addCatalogToTame(item)} class="bg-slate-950/70 border border-slate-800/80 hover:border-blue-500/50 rounded-xl p-3 flex items-center justify-between cursor-pointer transition">
                                <div class="flex items-center gap-3">
                                    <div class="w-7 h-7 bg-slate-900 rounded-lg border border-slate-800 flex items-center justify-center text-slate-500 text-xs">
                                        <i class="fa-solid fa-box"></i>
                                    </div>
                                    <div>
                                        <div class="text-xs font-semibold text-slate-200">{item.name}</div>
                                        <div class="text-[11px] text-slate-500">[{item.cat}] — {item.price.toFixed(2)} € / {item.unit}</div>
                                    </div>
                                </div>
                                <i class="fa-solid fa-plus text-slate-600 text-xs"></i>
                            </div>
                        ))}
                    </div>
                </div>

                {/* Tāmē iekļautie darbi */}
                <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-3.5 space-y-2.5">
                    <div class="flex items-center gap-2 text-xs font-bold text-slate-300 uppercase tracking-wide">
                        <i class="fa-solid fa-clipboard-check text-blue-400"></i> Tāmē iekļautie darbi ({tameItems.length})
                    </div>

                    {tameItems.length === 0 ? (
                        <div class="text-center py-4 text-xs text-slate-500">Tāme pagaidām ir tukša</div>
                    ) : (
                        <div class="space-y-2">
                            {tameItems.map(item => (
                                <div key={item.id} class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 space-y-2">
                                    <div class="flex justify-between items-center">
                                        <input 
                                            type="text" 
                                            value={item.name} 
                                            onChange={(e) => updateTameItem(item.id, 'name', e.target.value)}
                                            class="bg-transparent text-xs font-semibold text-slate-100 focus:outline-none w-full mr-2"
                                        />
                                        <button onClick={() => removeTameItem(item.id)} class="text-slate-500 hover:text-red-400 text-xs">
                                            <i class="fa-solid fa-xmark"></i>
                                        </button>
                                    </div>
                                    <div class="grid grid-cols-3 gap-2 text-xs">
                                        <input 
                                            type="number" 
                                            value={item.qty} 
                                            onChange={(e) => updateTameItem(item.id, 'qty', e.target.value)}
                                            class="bg-slate-900 border border-slate-800 rounded px-2 py-1 text-slate-200"
                                            placeholder="Daudzums"
                                        />
                                        <select 
                                            value={item.unit} 
                                            onChange={(e) => updateTameItem(item.id, 'unit', e.target.value)}
                                            class="bg-slate-900 border border-slate-800 rounded px-1 py-1 text-slate-200"
                                        >
                                            <option value="m²">m²</option>
                                            <option value="m">m</option>
                                            <option value="gab.">gab.</option>
                                            <option value="St">St</option>
                                            <option value="kompl.">kompl.</option>
                                        </select>
                                        <input 
                                            type="number" 
                                            step="0.01" 
                                            value={item.price} 
                                            onChange={(e) => updateTameItem(item.id, 'price', e.target.value)}
                                            class="bg-slate-900 border border-slate-800 rounded px-2 py-1 text-slate-200 text-right"
                                            placeholder="Cena"
                                        />
                                    </div>
                                    <div class="text-right text-xs font-bold text-blue-400 pt-1 border-t border-slate-900">
                                        Kopā: {(item.qty * item.price).toFixed(2)} €
                                    </div>
                                </div>
                            ))}

                            <div class="pt-2 flex justify-between items-center text-sm font-bold border-t border-slate-800">
                                <span class="text-slate-400">Kopējā summa ({pvnType}):</span>
                                <span class="text-amber-500">{subtotal.toFixed(2)} €</span>
                            </div>
                        </div>
                    )}
                </div>
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CraftApp />);
</script>

</body>
</html>
