<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftMate – Rēķini un Tāmes</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .blueprint-bg {
            background-color: #0f172a;
            background-image: linear-gradient(rgba(59, 130, 246, 0.1) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(59, 130, 246, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="blueprint-bg text-slate-100 min-h-screen p-4 md:p-8">

<div id="root"></div>

<script type="text/babel">
    const { useState } = React;

    function CraftMateApp() {
        const [items, setItems] = useState([
            { id: 1, name: "Grīdas sagatavošana un ieklāšana", qty: 50, unit: "m²", price: 12.00 },
            { id: 2, name: "Sienu špaktelēšana un krāsošana", qty: 120, unit: "m²", price: 15.00 },
            { id: 3, name: "Cauruļvadu montāža", qty: 15, unit: "m", price: 25.00 },
            { id: 4, name: "Elektromontāžas punktu izbūve", qty: 20, unit: "gab.", price: 18.00 },
            { id: 5, name: "Demontāžas darbi", qty: 1, unit: "kompl.", price: 250.00 }
        ]);

        const handleItemChange = (id, field, value) => {
            setItems(items.map(item => {
                if (item.id === id) {
                    return { ...item, [field]: field === 'name' || field === 'unit' ? value : parseFloat(value) || 0 };
                }
                return item;
            }));
        };

        const addItem = () => {
            setItems([...items, { id: Date.now(), name: "", qty: 1, unit: "m²", price: 0.00 }]);
        };

        const deleteItem = (id) => {
            setItems(items.filter(item => item.id !== id));
        };

        const calculateTotal = () => {
            return items.reduce((sum, item) => sum + (item.qty * item.price), 0).toFixed(2);
        };

        return (
            <div class="max-w-5xl mx-auto bg-slate-900/90 border border-slate-700 rounded-xl p-6 shadow-2xl backdrop-blur">
                <div class="border-b border-slate-700 pb-4 mb-6">
                    <h1 class="text-3xl font-bold text-blue-400">CraftMate Tāme</h1>
                    <p class="text-slate-400 text-sm">Darbu saraksts un izcenojumu aprēķins</p>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse mb-6">
                        <thead>
                            <tr class="border-b border-slate-700 text-slate-400 text-sm">
                                <th class="p-2 w-2/5">Darba apraksts</th>
                                <th class="p-2 w-1/6">Daudzums</th>
                                <th class="p-2 w-1/6">Mērvienība</th>
                                <th class="p-2 w-1/6">Cena (€)</th>
                                <th class="p-2 w-1/6 text-right">Kopā (€)</th>
                                <th class="p-2 w-12 text-center"></th>
                            </tr>
                        </thead>
                        <tbody>
                            {items.map((item) => (
                                <tr key={item.id} class="border-b border-slate-800/80 hover:bg-slate-800/40">
                                    <td class="p-2">
                                        <input 
                                            type="text" 
                                            value={item.name} 
                                            onChange={(e) => handleItemChange(item.id, 'name', e.target.value)}
                                            placeholder="Ievadiet darbu..."
                                            class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-white focus:outline-none focus:border-blue-500"
                                        />
                                    </td>
                                    <td class="p-2">
                                        <input 
                                            type="number" 
                                            value={item.qty} 
                                            onChange={(e) => handleItemChange(item.id, 'qty', e.target.value)}
                                            class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-white text-right focus:outline-none focus:border-blue-500"
                                        />
                                    </td>
                                    <td class="p-2">
                                        <select 
                                            value={item.unit} 
                                            onChange={(e) => handleItemChange(item.id, 'unit', e.target.value)}
                                            class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-white focus:outline-none focus:border-blue-500"
                                        >
                                            <option value="m²">m²</option>
                                            <option value="m">m</option>
                                            <option value="gab.">gab.</option>
                                            <option value="kompl.">kompl.</option>
                                            <option value="h">h</option>
                                        </select>
                                    </td>
                                    <td class="p-2">
                                        <input 
                                            type="number" 
                                            step="0.01"
                                            value={item.price} 
                                            onChange={(e) => handleItemChange(item.id, 'price', e.target.value)}
                                            class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-white text-right focus:outline-none focus:border-blue-500"
                                        />
                                    </td>
                                    <td class="p-2 text-right font-semibold text-blue-300">
                                        {(item.qty * item.price).toFixed(2)} €
                                    </td>
                                    <td class="p-2 text-center">
                                        <button 
                                            onClick={() => deleteItem(item.id)}
                                            class="text-red-400 hover:text-red-300 font-bold px-2 py-1"
                                        >
                                            ✕
                                        </button>
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>

                <div class="flex flex-col md:flex-row justify-between items-center gap-4 border-t border-slate-700 pt-4">
                    <button 
                        onClick={addItem}
                        class="w-full md:w-auto bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-2 rounded-lg transition"
                    >
                        + Pievienot darbu
                    </button>
                    <div class="text-xl font-bold text-slate-200">
                        Kopā bez PVN: <span class="text-blue-400">{calculateTotal()} €</span>
                    </div>
                </div>
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CraftMateApp />);
</script>

</body>
</html>
